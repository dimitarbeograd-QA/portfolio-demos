<title>Каса При Маца</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;700&family=Lora:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Layout: категории като табове, плочки с продукти вляво, сметка вдясно (на телефон – цял екран, отварян от лента долу) */
:root{
  --bg:#eaf1f8; --surface:#ffffff; --ink:#102a43; --muted:#4a6178; --line:#cbd8e5;
  --accent:#1565c0; --accent-ink:#ffffff; --danger:#c62828; --ok:#1b7f4b; --warn:#b45f06;
  --paper:#fffffe; --paper-ink:#14202c; --scrim:rgba(20,12,8,.58);
  --f-display:'Lora',Georgia,serif; --f-body:'Fira Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1b2a; --surface:#16283b; --ink:#e9f1f9; --muted:#a3b8cc; --line:#2b4560;
    --accent:#64b5f6; --accent-ink:#06233f; --danger:#ff8a80; --ok:#6fd39b; --warn:#ffb74d; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1b2a; --surface:#16283b; --ink:#e9f1f9; --muted:#a3b8cc; --line:#2b4560;
  --accent:#64b5f6; --accent-ink:#06233f; --danger:#ff8a80; --ok:#6fd39b; --warn:#ffb74d; color-scheme:dark;
}
*{box-sizing:border-box}
body{overflow-wrap:break-word}
.fld input,.fld select{width:100%}
input[type=date]{min-height:46px}
body{background:var(--bg);color:var(--ink);font:20px/1.4 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:8px;padding-bottom:104px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:6px 12px}
.brand h1{margin:0;font:700 34px/1.1 var(--f-display);letter-spacing:.02em}
.brand span{display:block;color:var(--muted);font-size:18px;margin-top:2px}
.hist{flex:none;white-space:nowrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;text-align:right;line-height:1.2}
.hist .k{display:block;color:var(--muted);font-size:15px;letter-spacing:.1em;text-transform:uppercase}
.hist b{font-variant-numeric:tabular-nums;font-size:21px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-block:4px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:500}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab .tc{display:inline-block;min-width:20px;margin-left:6px;padding:0 6px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:15px;font-weight:700;text-align:center}
.layout{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
main{min-width:0}
main h2{margin:8px 0 12px;font:700 17px/1.2 var(--f-display);letter-spacing:.12em;text-transform:uppercase}
main h2 small{font:400 16px var(--f-body);letter-spacing:0;text-transform:none;color:var(--muted);margin-left:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.prod{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:8px;min-height:92px;padding:12px;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;text-align:left}
button.prod:active,.size:active{transform:scale(.98)}
.prod .nm{font-weight:500;line-height:1.2;overflow-wrap:anywhere}
.prod .meta{display:flex;justify-content:space-between;align-items:baseline;gap:6px;color:var(--muted);font-size:15px}
.prod .pr{font-weight:700;font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.prod.pizza{grid-column:span 2;min-height:0}
.sizes{display:flex;gap:10px}
.size{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;
  background:var(--bg);border:1px solid var(--line);border-radius:8px;text-align:left}
.size span{font-size:17px;color:var(--muted)}
.size b{font-size:22px;font-variant-numeric:tabular-nums}
.badge{position:absolute;top:-9px;right:-6px;min-width:30px;height:30px;padding:0 8px;border-radius:15px;background:var(--accent);color:var(--accent-ink);
  font:700 18px/34px var(--f-body);font-style:normal;text-align:center;font-variant-numeric:tabular-nums;pointer-events:none}
/* Менюто като на хартиения лист */
.menu{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 18px 4px}
.mhead{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px 16px;padding-bottom:12px;margin-bottom:18px;border-bottom:2px solid var(--ink)}
.mhead h2{margin:0;font:700 27px/1.2 var(--f-display)}
.mhead span{font:600 italic 21px var(--f-display);color:var(--muted)}
.mcols{display:grid;grid-template-columns:minmax(0,1fr);gap:0 36px}
@media (min-width:700px){.mcols{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.sec{margin-bottom:24px}
.sec h3{margin:0 0 6px;font:700 20px/1.2 var(--f-display);letter-spacing:.12em;text-transform:uppercase}
.sec h3 small{font:400 17px var(--f-body);letter-spacing:0;text-transform:none;color:var(--muted);margin-left:8px}
.mi{display:flex;align-items:center;gap:4px;border-radius:8px}
.mi.on{background:var(--bg)}
.mbtn{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;min-height:44px;padding:9px 8px;background:none;border:0;border-radius:8px;text-align:left}
.mbtn:active{background:var(--bg)}
.minus{flex:none;width:44px;height:44px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--danger);font-size:27px;line-height:1;visibility:hidden}
.on>.minus{visibility:visible}
.szw{flex:1;min-width:0;display:flex;gap:6px}
.szw .size{flex:1;min-width:0}
.szw .minus{align-self:stretch;height:auto}
.mn{min-width:0;line-height:1.25;overflow-wrap:anywhere}
.mn small{display:block;color:var(--muted);font-size:16px}
.dots{flex:1;min-width:10px;height:0;border-bottom:2px dotted var(--muted);opacity:.45}
.mi .badge{position:static;display:inline-block;flex:none;align-self:center}
.mp{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.pz{padding:8px 8px 10px}
.pz .mn{display:block;margin-bottom:6px}
.pzb{display:flex;flex-direction:column;gap:8px}
.testbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;margin-bottom:12px;background:var(--surface);border:2px solid var(--warn);border-radius:10px}
.testbar b{color:var(--warn);text-transform:uppercase;letter-spacing:.08em;font-size:17px}
.testbar span{flex:1;min-width:140px;color:var(--muted);font-size:17px}
.login>.ghost{padding:14px}
/* Маси */
#tfilter button{padding:8px 10px;font-size:18px}
body:not(.in-order) .bar{display:none}
.vh{margin:0 0 10px;font:700 20px var(--f-display);letter-spacing:.12em;text-transform:uppercase}
.tsum{color:var(--muted);margin:12px 0}
.tsum b{color:var(--ink);font-variant-numeric:tabular-nums}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.tb{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:6px;min-height:100px;padding:10px;background:var(--surface);border:2px solid var(--line);border-radius:10px;text-align:left;min-width:0}
.tb:active{transform:scale(.97)}
.tb .tn{font:700 31px/1 var(--f-display)}
.tb .tf{color:var(--muted);font-size:16px}
.tb .ta{font-weight:700;font-size:19px;font-variant-numeric:tabular-nums}
.tb .tw{font-size:15px;color:var(--muted);overflow-wrap:break-word;line-height:1.2}
.tb.busy{border-color:var(--warn)}
.tb.mine{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tb.mine .tw,.tb.mine .tf{color:inherit;opacity:.9}
.ohead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ohead b{font:700 29px var(--f-display)}
.ohead span{color:var(--muted);min-width:0;overflow-wrap:anywhere}
.tbl b{font:700 25px var(--f-display)}
.back2{flex:none;width:48px;height:48px;display:grid;place-items:center;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:29px;line-height:1}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.ohead{position:sticky;top:env(safe-area-inset-top,0px);z-index:12;background:var(--bg);padding-block:8px}
.obar{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;border-radius:0 0 12px 12px;background:var(--ink);color:var(--bg)}
.obar b{min-width:0;overflow-wrap:anywhere;font:700 21px var(--f-display)}
.obar .back2{background:transparent;color:inherit;border-color:currentColor}
.tipstats .wide{grid-column:1/-1}
.tipstats>div{border:1px solid var(--accent,var(--line))}
.hrow b small{display:block;font-weight:400;font-size:15px;color:var(--muted)}
.totop{position:fixed;z-index:40;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(104px + env(safe-area-inset-bottom,0px));width:48px;height:48px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:27px;opacity:.92;line-height:1;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.35)}
/* Бърза смяна на роля */
.rolesw{display:flex;gap:8px;flex-wrap:wrap;flex:1 1 100%}
.rolesw button{flex:1 1 0;min-width:0;padding:12px 2px;font-size:16px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-weight:600}
@media (max-width:350px){.rolesw button{flex:1 1 40%;padding:12px 6px}}
.rolesw button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.testbar .rolesw{margin-top:2px}
.tlogin{display:flex;flex-direction:column;gap:8px}
.tlogin .ghost{width:100%}
.take{margin-left:auto;padding:12px 16px;border:0;border-radius:10px;background:var(--ok);color:#fff;font-weight:700;font-size:18px}
.kc.taken{border-color:var(--line);opacity:.75}
.tbw{position:relative;display:flex;min-width:0}
.tbw .tb{flex:1;min-height:118px}
.tnote{position:absolute;top:5px;right:5px;max-width:66%;min-width:34px;min-height:34px;padding:3px 6px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.12;font-weight:600;text-align:right;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.tnote.add{color:var(--muted);font-weight:400;font-size:18px;text-align:center;display:grid;place-items:center;opacity:.8}
.tnote.has{background:var(--warn);border-color:var(--warn);color:#fff}
.tb.mine~.tnote.add{color:var(--accent-ink);background:transparent;border-color:currentColor}
.tnq{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.tnq button{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:16px}
.trs{margin-top:2px;padding:2px 7px;border-radius:8px;background:var(--warn);color:#fff;font-size:15px;font-weight:700;white-space:nowrap}
.tnt{font-size:14px;line-height:1.15;color:var(--muted);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tb.mine .tnt{color:inherit;opacity:.9}
/* Редактор на меню */
.med{gap:14px}
.mc{border:2px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.mch{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mch b{font:700 19px var(--f-display)}
.mcb,.mib{display:flex;gap:6px}
.mcb button,.mib button{min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:19px}
.mcb button.arm,.mib button.arm{background:var(--danger);color:#fff;border-color:var(--danger);font-size:15px;padding:0 8px}
.mc input[type=text],.mc input[type=number],.med input[type=text]{width:100%;min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-size:18px}
.mi2{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:8px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.mi2 .mnote{grid-column:1/-1}
.mi2 .mib{grid-column:1/-1;justify-content:flex-end}
.mi2.pz{grid-template-columns:minmax(0,1fr)}
.chk{display:flex;gap:10px;align-items:center;font-size:18px;color:var(--ink)}
.chk input{width:24px;height:24px;flex:none}
.psz{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.psz label{display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:16px}
.mphoto{display:flex;flex-direction:column;gap:8px;padding:12px;border:2px dashed var(--accent);border-radius:12px}
.mphoto .issue{width:100%;display:block;text-align:center;cursor:pointer}
.mmsg{font-size:17px;color:var(--ink);overflow-wrap:anywhere}
.mmsg.err{color:var(--danger)}
.mimp{display:flex;flex-direction:column;gap:8px}
.tm{font-variant-numeric:tabular-nums}
.okt{flex:1 1 100%;font-size:18px;color:var(--muted)}
.okt b{color:var(--ink)}
.ka1 small{display:block;font-weight:500;font-size:16px;opacity:.95}
/* Кухня */
.kstat{font-size:15px;color:var(--muted);white-space:nowrap}
.kstat.on{color:var(--ok)} .kstat.off{color:var(--warn)}
.ksec{margin:18px 0 10px;font:700 22px var(--f-display)}
.kgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr))}
.kc{background:var(--surface);border:3px solid var(--warn);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.kc.old{border-color:var(--danger)}
.kc.done{border-color:var(--ok)}
.kc .kh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.kc .kt{font:700 36px/1 var(--f-display)}
.kc .kw{color:var(--muted);font-size:18px}
.kc .ka{font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.kc ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.kc li{display:flex;gap:10px;align-items:baseline;font-size:24px;line-height:1.25;font-weight:500;min-width:0}
.kc li b{flex:none;min-width:2.1em;font-size:28px;font-variant-numeric:tabular-nums}
.kc li span{min-width:0;overflow-wrap:anywhere}
.kc li.new span::after{content:" НОВО";color:var(--danger);font-weight:700;font-size:16px}
.kc li.dn{opacity:.55}
.kdone{width:100%;padding:18px;font-size:24px;font-weight:700;border:0;border-radius:12px;background:var(--ok);color:#fff}
.kundo{width:100%;padding:12px;font-size:18px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.kempty{padding:26px 10px;text-align:center;color:var(--muted);font-size:20px}
.kalert{position:fixed;z-index:45;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;pointer-events:none}
.kalert .ka1{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--ok);color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.35);font-size:21px;font-weight:700;animation:kpulse 1.2s ease-in-out 3}
.kalert .ka1 span{flex:1;min-width:0;overflow-wrap:anywhere}
.kalert .ka1 button{flex:none;border:2px solid #fff;background:transparent;color:#fff;border-radius:10px;padding:10px 14px;font-weight:700;font-size:18px}
@keyframes kpulse{50%{transform:scale(1.02)}}
.tb .tk{font-size:14px;font-weight:700;padding:2px 5px;border-radius:8px;background:var(--bg);color:var(--ink);border:1px solid var(--line);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tb.rdy{border-color:var(--ok);box-shadow:0 0 0 3px var(--ok)}
.tb.rdy .tk{background:var(--ok);color:#fff;border-color:var(--ok)}
/* Фактура */
.invbox{display:flex;flex-direction:column;gap:10px}
.paper.inv{font-family:var(--f-body);font-size:17px;line-height:1.4}
.paper .party{margin-bottom:10px}
.paper .tw{overflow-x:auto}
.paper table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.paper th,.paper td{padding:4px 0 4px 8px;text-align:right;vertical-align:top;border-bottom:1px solid var(--line)}
.paper th:first-child,.paper td:first-child{text-align:left;padding-left:0}
.paper th{font-size:15px}
/* Вход, персонал, бакшиш */
.locked .wrap,.locked .bar{display:none}
.login{max-width:420px;margin:0 auto;padding-block:40px;display:flex;flex-direction:column;gap:18px}
.lform{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.lform label,.fld{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:18px}
.hint{margin:0;color:var(--muted);font-size:18px}
.err{color:var(--danger);min-height:1.4em;font-weight:500}
.who{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding-bottom:12px;color:var(--muted)}
.who .ghost{flex:1 1 auto;padding:9px 12px;font-size:18px;text-align:center}
.who #whoName{flex:1 1 100%;font-weight:500;color:var(--ink);min-width:0;overflow-wrap:anywhere}
.grow{display:none}
select{font:inherit;font-size:20px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tipc{display:flex;align-items:center;gap:10px}
.tipc span{color:var(--muted);font-size:18px}
.tipc input{flex:1}
.payrow{display:flex;justify-content:space-between;align-items:baseline;padding:10px 12px;background:var(--bg);border-radius:8px}
.payrow span{color:var(--muted)}
.payrow b{font-size:29px;font-variant-numeric:tabular-nums}
.urow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.urow small{display:block;color:var(--muted);font-size:16px}
.urow b{white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.panel h4{margin:10px 0 0;font:700 19px var(--f-display)}
/* Сметка */
.lbl{color:var(--muted);font-size:17px;margin-bottom:-6px}
.check{display:flex;flex-direction:column;gap:12px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.ch{display:flex;align-items:center;gap:10px}
.ch h2{flex:1;margin:0;font:700 25px var(--f-display);letter-spacing:.04em}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.ghost.confirm{border-color:var(--danger);color:var(--danger);font-weight:700}
.tbl{display:flex;align-items:center;gap:10px}
.tbl span{color:var(--muted);font-size:16px}
input{font:inherit;font-size:20px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.tbl input{flex:1}
.lines{min-height:140px}
.check>*{flex-shrink:0}
.empty{color:var(--muted);padding:24px 8px;text-align:center}
.line{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ln{display:flex;flex-direction:column;min-width:0;grid-column:1/-1}
.ln span{overflow-wrap:anywhere;line-height:1.2}
.ln small{color:var(--muted);font-size:17px;font-variant-numeric:tabular-nums}
.step{display:flex;align-items:center;gap:4px}
.step button{width:44px;height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:27px;line-height:1}
.step output{min-width:26px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.sum{min-width:0;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.foot{display:flex;flex-direction:column;gap:12px}
.total{display:flex;justify-content:space-between;align-items:baseline}
.total span{color:var(--muted);font-size:17px;letter-spacing:.1em;text-transform:uppercase}
.total b{font-size:43px;font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{padding:13px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cash{display:flex;flex-direction:column;gap:8px}
.cash label{display:flex;align-items:center;gap:10px}
.cash label span{color:var(--muted);font-size:18px}
.cash input{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-variant-numeric:tabular-nums}
#change{font-weight:700;font-variant-numeric:tabular-nums;min-height:1.4em}
#change.ok{color:var(--ok)} #change.short{color:var(--danger)}
.issue{width:100%;padding:16px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:24px;font-weight:700}
.issue:disabled{opacity:.4}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;justify-content:space-between;align-items:center;gap:12px;
  background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar small{display:block;color:var(--muted);font-size:17px}
.bar b{font-size:31px;font-variant-numeric:tabular-nums}
.bar .issue{width:auto;padding:14px 20px;white-space:nowrap;flex:none}
.bar>div{min-width:0}
@media (max-width:899px){
  .check{position:fixed;inset:0;z-index:20;display:none;border:0;border-radius:0;
    padding-top:0;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bg)}
  body.sheet-open .check{display:flex}
  .ch{position:sticky;top:0;z-index:3;background:var(--bg);padding:calc(10px + env(safe-area-inset-top,0px)) 0 10px}
  body.sheet-open{overflow:hidden}
}
@media (min-width:900px){
  body{padding-bottom:24px}
  .layout{grid-template-columns:minmax(0,1fr) 390px;align-items:start}
  .lines{flex:1 1 auto;overflow:auto;min-height:120px}
  .check{position:sticky;top:80px;max-height:calc(100vh - 92px);max-height:calc(100dvh - 92px)}
  .bar,.back{display:none}
}
/* Бележка и история */
.overlay{position:fixed;inset:0;z-index:30;overflow:auto;background:var(--scrim);
  padding-top:0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));

.card{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.paper{background:var(--paper);color:var(--paper-ink);padding:22px 18px;border-radius:4px;font:18px/1.45 'Courier New',ui-monospace,monospace;box-shadow:0 6px 24px rgba(0,0,0,.35)}

.paper small{font-size:16px}

.panel{background:var(--surface);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h3{margin:0;font:700 20px var(--f-display)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;text-align:center}
.stats div{background:var(--bg);border-radius:8px;padding:8px 4px}
.stats small{display:block;color:var(--muted);font-size:16px}
.stats b{font-variant-numeric:tabular-nums}
.hrow{display:flex;justify-content:space-between;gap:10px;width:100%;padding:12px 4px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}

  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;text-align:center}

    }

    var usr=users.filter(function(x){return x.u===un})[0],ok=false;

          (c.pizza?'':'<input class="mnote" type="text" data-f="note" maxlength="40" placeholder="Допълнение (напр. 250 мл.)" value="'+esc(it.note||'')+'">')+
          '<span class="mib"><button type="button" data-miup aria-label="Нагоре"'+(ii?'':' disabled')+'>↑</button><button type="button" data-midn aria-label="Надолу"'+(ilast?' disabled':'')+'>↓</button>'+
          '<button type="button" data-midel'+(mArm==='i'+ci+'.'+ii?' class="arm">Сигурен?':'>✕')+'</button></span></div>';
      });
      h+='<button class="ghost" type="button" data-maddi>+ Добави артикул</button></section>';
    });
    h+='<button class="ghost" type="button" data-maddc>+ Нова категория</button>'+
      '<div class="acts"><button class="issue" type="button" data-msave>Запази менюто</button>'+
      '<button class="ghost" type="button" data-mreset>'+(mArm==='reset'?'Сигурен ли си? Натисни пак':'Върни стандартното меню')+'</button>'+
      '<button class="ghost" type="button" data-close>Откажи</button></div><div class="err" id="m_err" role="alert"></div></div>';
    ovBody.innerHTML=h;ovShow();
    if(!first)ov.scrollTop=st;
  }
  function mMove(arr,i,d){var j=i+d;if(j<0||j>=arr.length)return;var t=arr[i];arr[i]=arr[j];arr[j]=t}
  function mArmed(key){if(mArm===key){mArm='';return true}mArm=key;return false}
  function saveMenuDraft(){
    var err=$('#m_err'),cats=[],cnt=0;
    for(var ci=0;ci<mdraft.cats.length;ci++){
      var c=mdraft.cats[ci],t=(c.title||'').trim();
      if(!t){err.textContent='Категория '+(ci+1)+' няма име.';return}
      var o={id:c.id,title:t,portion:(c.portion||'').trim(),pizza:!!c.pizza,sizes:null,sl:(c.sl||'').trim(),bl:(c.bl||'').trim(),items:[]};
      if(c.pizza){
        var sp=mnum(c._ss),bp=mnum(c._sb);
        if(!sp||!bp){err.textContent='В „'+t+'“ въведи цена за малка и голяма.';return}
        o.sizes={s:sp,b:bp};
      }
      for(var ii=0;ii<c.items.length;ii++){
        var it=c.items[ii],n=(it.n||'').trim();
        if(!n){err.textContent='В „'+t+'“ има артикул без име.';return}
        var pr=0;
        if(!c.pizza){pr=mnum(it._ps);if(!pr){err.textContent='„'+n+'“ няма валидна цена.';return}}
        o.items.push({id:it.id,n:n,p:pr,note:(it.note||'').trim()});cnt++;
      }
      if(!o.items.length){err.textContent='Категория „'+t+'“ е празна – добави артикул или я махни.';return}
      cats.push(o);
    }
    if(!cats.length||!cnt){err.textContent='Менюто трябва да има поне един артикул.';return}
    var gone=Object.assign({},menuData.gone||{}),keep={};
    cats.forEach(function(c){c.items.forEach(function(it){keep[it.id]=1})});
    menuData.cats.forEach(function(c){c.items.forEach(function(it){if(!keep[it.id])gone[it.id]={n:it.n,p:it.p||0,pz:!!(c.pizza&&c.sizes),s:c.sizes?c.sizes.s:0,b:c.sizes?c.sizes.b:0}})});
    cats.forEach(function(c){c.items.forEach(function(it){delete gone[it.id]})});
    var nm={head:(mdraft.head||'').trim()||'Меню за деня',cats:cats,gone:gone,u:Date.now()};
    menuData=nm;saveMenuLocal();applyMenu();buildMenu();render();mPush();
    closeOv();mdraft=null;toast('Менюто е запазено');
  }
  function aiToCats(res){
    var out=[];
    if(!res||!Array.isArray(res.cats))return out;
    res.cats.slice(0,40).forEach(function(c){
      if(!c||typeof c.title!=='string'||!c.title.trim()||!Array.isArray(c.items))return;
      var pz=!!c.pizza&&mnum(c.small)>0&&mnum(c.big)>0;
      var o={id:mkid(),title:c.title.trim().slice(0,40),portion:String(c.portion||'').slice(0,40),pizza:pz,sizes:pz?{s:mnum(c.small),b:mnum(c.big)}:null,sl:String(c.sl||'Малка').slice(0,30),bl:String(c.bl||'Голяма').slice(0,30),items:[]};
      c.items.slice(0,150).forEach(function(it){
        if(!it||typeof it.n!=='string'||!it.n.trim())return;
        var p=pz?0:mnum(it.p);
        o.items.push({id:mkid(),n:it.n.trim().slice(0,60),p:p,note:String(it.note||'').slice(0,40)});
      });
      if(o.items.length)out.push(mfix(o));
    });
    return out;
  }
  async function importPhoto(file){
    var sm=null;
    try{sm=await window.claude.use('sample')}catch(e){}
    if(!sm){mSampleOk=false;mMsg='';renderMenuEd(false);return}
    mBusy=true;mMsg='';mErr=false;mImp=null;renderMenuEd(false);
    mCtl=new AbortController();
    try{
      var res=await sm.json(MPROMPT,{images:file,signal:mCtl.signal,cache:false});
      var cats=aiToCats(res);
      if(!cats.length){mMsg='Не намерих меню на снимката. Опитай с по-ясна снимка.';mErr=true}
      else{mImp={cats:cats,head:(res&&typeof res.head==='string')?res.head.trim().slice(0,40):''};mMsg=''}
    }catch(e){
      var c=e&&e.code;mErr=true;
      mMsg=c==='cancelled'?'Спряно.':c==='not_granted'?'Не си разрешил на страницата да ползва Claude.':c==='rate_limited'?'Твърде много опити или е изчерпан лимитът. Опитай по-късно.':
        c==='image_rejected'?'Снимката не е приета. Пробвай друга (JPG или PNG).':c==='invalid_json'?'Не успях да разчета менюто. Опитай с по-ясна снимка.':
        (c==='images_unavailable'||c==='sampling_disabled'||c==='not_declared')?'Четенето от снимка не е налично тук. Въведи менюто ръчно.':'Грешка при четенето. Опитай пак.';
      if(c==='cancelled')mErr=false;
    }
    mBusy=false;mCtl=null;
    if(mdraft&&!ov.hidden)renderMenuEd(false);
  }
  ovBody.addEventListener('input',function(e){
    if(!mdraft)return;var t=e.target;
    if(t.hasAttribute('data-mh')){mdraft.head=t.value;return}
    var f=t.dataset&&t.dataset.f;if(!f)return;
    var cs=t.closest('[data-ci]');if(!cs)return;
    var c=mdraft.cats[+cs.dataset.ci],is=t.closest('[data-ii]');
    if(is)c.items[+is.dataset.ii][f]=t.value;else if(f!=='pizza')c[f]=t.value;
  });
  ovBody.addEventListener('change',function(e){
    if(!mdraft){if(e.target.id==='tn_time'){}}
    if(mdraft&&e.target.id==='m_file'){var fl=e.target.files&&e.target.files[0];if(fl)importPhoto(fl);return}
    if(!mdraft)return;var t=e.target;
    if(t.dataset&&t.dataset.f==='pizza'){
      var c=mdraft.cats[+t.closest('[data-ci]').dataset.ci];c.pizza=t.checked;
      if(c.pizza&&!c.sizes){c.sizes={s:0,b:0};c._ss='';c._sb=''}
      renderMenuEd(false);
    }
  });
  ovBody.addEventListener('click',function(e){
    if(!mdraft)return;var t=e.target.closest('button');if(!t)return;
    if(!t.hasAttribute('data-mcdel')&&!t.hasAttribute('data-midel')&&!t.hasAttribute('data-mreset'))mArm='';
    var cs=t.closest('[data-ci]'),ci=cs?+cs.dataset.ci:-1,is=t.closest('[data-ii]'),ii=is?+is.dataset.ii:-1;
    if(t.hasAttribute('data-msave')){saveMenuDraft();return}
    if(t.hasAttribute('data-mstop')){if(mCtl)mCtl.abort();return}
    if(t.hasAttribute('data-mreset')){if(mArmed('reset')){mdraft=cloneM(DEFAULT_MENU);mdraft.cats.forEach(mfix);mdraft.gone=menuData.gone}renderMenuEd(false);return}
    if(t.dataset.mimp){
      var how=t.dataset.mimp;
      if(how==='replace'){mdraft.cats=mImp.cats;if(mImp.head)mdraft.head=mImp.head}
      else if(how==='append')mdraft.cats=mdraft.cats.concat(mImp.cats);
      mImp=null;renderMenuEd(false);return;
    }
    if(t.hasAttribute('data-maddc')){mdraft.cats.push(mfix({id:mkid(),title:'',portion:'',pizza:false,sizes:null,sl:'Малка',bl:'Голяма',items:[{id:mkid(),n:'',p:0,note:''}]}));renderMenuEd(false);setTimeout(function(){ov.scrollTop=ov.scrollHeight},0);return}
    if(ci<0)return;
    var c=mdraft.cats[ci];
    if(t.hasAttribute('data-mcup')){mMove(mdraft.cats,ci,-1)}
    else if(t.hasAttribute('data-mcdn')){mMove(mdraft.cats,ci,1)}
    else if(t.hasAttribute('data-mcdel')){if(mArmed('c'+ci))mdraft.cats.splice(ci,1)}
    else if(t.hasAttribute('data-maddi')){c.items.push({id:mkid(),n:'',p:0,note:'',_ps:''})}
    else if(ii>=0&&t.hasAttribute('data-miup')){mMove(c.items,ii,-1)}
    else if(ii>=0&&t.hasAttribute('data-midn')){mMove(c.items,ii,1)}
    else if(ii>=0&&t.hasAttribute('data-midel')){if(mArmed('i'+ci+'.'+ii))c.items.splice(ii,1)}
    else return;
    renderMenuEd(false);
  });
  $('#menuBtn').addEventListener('click',showMenuEditor);
  document.addEventListener('click',function(e){
    var tn=e.target.closest('[data-tn]');if(tn){showNote(+tn.dataset.tn);return}
    tn=e.target.closest('[data-tnsave]');if(tn){setNote(+tn.dataset.tnsave,{t:$('#tn_text').value,h:$('#tn_time').value,p:$('#tn_people').value});closeOv();return}
    tn=e.target.closest('[data-tnclear]');if(tn){setNote(+tn.dataset.tnclear,{});closeOv();return}
    var a=e.target.closest('[data-kdone]');if(a){kDone(a.dataset.kdone,false);return}
    a=e.target.closest('[data-kundo]');if(a){kDone(a.dataset.kundo,true);return}
    a=e.target.closest('[data-kseen]');if(a){kSeen(a.dataset.kseen)}
  });

  try{$('#today').textContent=new Date().toLocaleDateString('bg-BG',{weekday:'long',day:'numeric',month:'long'})}catch(e){}
  buildMenu();render();
  var tm=null;try{tm=sessionStorage.getItem('pm_test')}catch(e){}
  if(tm==='1'&&ALLOW_TEST)startTest();
  else{
    var sid=null;try{sid=sessionStorage.getItem('pm_me')}catch(e){}
    var su=sid?users.filter(function(x){return x.u===sid})[0]:null;
    if(su)enter(su);else showLogin();
  }
  /* стрелка нагоре */
  (function(){
    var b=$('#totop'),chk=$('#check');
    function sc(){
      if(!ov.hidden)return ov;
      if(document.body.classList.contains('sheet-open')&&window.innerWidth<900)return chk;
      return null;
    }
    function top(){var e=sc();return e?e.scrollTop:(window.pageYOffset||document.documentElement.scrollTop||0)}
    function upd(){b.hidden=document.body.classList.contains('locked')||top()<300}
    b.addEventListener('click',function(){var e=sc();if(e)e.scrollTo({top:0,behavior:'smooth'});else window.scrollTo({top:0,behavior:'smooth'})});
    document.addEventListener('scroll',upd,true);
    window.addEventListener('resize',upd);
    new MutationObserver(upd).observe(document.body,{attributes:true,attributeFilter:['class']});
    new MutationObserver(upd).observe(ov,{attributes:true,attributeFilter:['hidden']});
    upd();
  })();
})();
</script>
