'use strict';
/* ===== Ядро: константи, помощни функции, вход ===== */
const TS=32,RW=20,RH=11,VW=RW*TS,VH=RH*TS; // 640x352
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const hash2=(x,y,s)=>{let h=(x*374761393+y*668265263+(s||0)*2147483647)|0;h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967296;};
const mkCanvas=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
const overlap=(a,b)=>a.x-a.w/2<b.x+b.w/2&&a.x+a.w/2>b.x-b.w/2&&a.y-a.h/2<b.y+b.h/2&&a.y+a.h/2>b.y-b.h/2;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const DIRS=[[0,1],[-1,0],[1,0],[0,-1]]; // 0=долу 1=ляво 2=дясно 3=горе
const dirOf=(dx,dy)=>Math.abs(dx)>Math.abs(dy)?(dx<0?1:2):(dy<0?3:0);

/* Вход: клавиатура + докосване -> единно състояние */
const INP={dx:0,dy:0,a:false,b:false,sw:false,menu:false,
  _a:false,_b:false,_sw:false,_menu:false,
  aP:false,bP:false,swP:false,menuP:false,upP:false,downP:false,leftP:false,rightP:false,
  keys:{},pa:false,pb:false,ps:false,pm:false,touchMove:null,touchA:false,touchB:false,touchSw:false,touchMenu:false,_ud:0,_lr:0,_pu:0,_pd:0,_pl:0,_pr:0,
  poll(){
    const k=this.keys;
    let dx=0,dy=0;
    if(k.ArrowLeft||k.KeyA)dx-=1;if(k.ArrowRight||k.KeyD)dx+=1;
    if(k.ArrowUp||k.KeyW)dy-=1;if(k.ArrowDown||k.KeyS)dy+=1;
    if(this.touchMove){dx=this.touchMove.x;dy=this.touchMove.y;}
    let gp=null;try{const g=navigator.getGamepads&&navigator.getGamepads();if(g)for(const p of g)if(p&&p.connected){gp=p;break;}}catch(e){}
    let ga=false,gb=false,gs=false,gm=false;
    if(gp){const ax=gp.axes[0]||0,ay=gp.axes[1]||0;if(Math.hypot(ax,ay)>.3){dx=ax;dy=ay;}
      const bt=i=>gp.buttons[i]&&gp.buttons[i].pressed;
      if(bt(14))dx=-1;if(bt(15))dx=1;if(bt(12))dy=-1;if(bt(13))dy=1;
      ga=bt(0)||bt(2);gb=bt(1)||bt(3);gs=bt(4)||bt(5);gm=bt(9)||bt(8);}
    const m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m;}
    this.dx=dx;this.dy=dy;
    const a=!!(k.KeyZ||k.KeyJ||k.Space||k.Enter||this.touchA||this.pa||ga);
    const b=!!(k.KeyX||k.KeyK||this.touchB||this.pb||gb);
    const sw=!!(k.KeyC||k.KeyL||k.Tab||this.touchSw||this.ps||gs);
    const mn=!!(k.Escape||k.KeyP||this.touchMenu||this.pm||gm);
    this.aP=a&&!this._a;this.bP=b&&!this._b;this.swP=sw&&!this._sw;this.menuP=mn&&!this._menu;
    this.a=a;this.b=b;this.sw=sw;this.menu=mn;this._a=a;this._b=b;this._sw=sw;this._menu=mn;
    const u=dy<-.5?1:0,d=dy>.5?1:0,l=dx<-.5?1:0,r=dx>.5?1:0;
    this.upP=!!(u&&!this._pu);this.downP=!!(d&&!this._pd);this.leftP=!!(l&&!this._pl);this.rightP=!!(r&&!this._pr);
    this.pa=this.pb=this.ps=this.pm=false;
    this._pu=u;this._pd=d;this._pl=l;this._pr=r;
  }
};

'use strict';
/* ===== Звук и музика – синтез с WebAudio, без файлове ===== */
const Snd=(()=>{
  let ctx=null,master,sfxG,musG,noiseBuf,revG;
  const st={sfx:true,mus:true};
  try{const s=JSON.parse(localStorage.getItem('ae_snd')||'{}');if(s.sfx===false)st.sfx=false;if(s.mus===false)st.mus=false;}catch(e){}
  const last={};
  const midi=m=>440*Math.pow(2,(m-69)/12);
  function init(){
    if(ctx){if(ctx.state==='suspended')ctx.resume();return;}
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    ctx=new AC();
    master=ctx.createGain();master.gain.value=.8;
    const comp=ctx.createDynamicsCompressor();master.connect(comp);comp.connect(ctx.destination);
    sfxG=ctx.createGain();sfxG.gain.value=st.sfx?.9:0;sfxG.connect(master);
    musG=ctx.createGain();musG.gain.value=st.mus?.5:0;musG.connect(master);
    noiseBuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    /* малко ехо за музиката */
    const dl=ctx.createDelay(1);dl.delayTime.value=.27;const fb=ctx.createGain();fb.gain.value=.28;const wet=ctx.createGain();wet.gain.value=.3;
    musG.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(master);
    if(M.want>=0)startMusic();
  }
  function save(){try{localStorage.setItem('ae_snd',JSON.stringify(st));}catch(e){}}
  function tone(f,dur,type,vol,to,when,dest){
    if(!ctx)return;const t=ctx.currentTime+(when||0);
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type||'square';o.frequency.setValueAtTime(f,t);
    if(to)o.frequency.exponentialRampToValueAtTime(Math.max(20,to),t+dur);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(dest||sfxG);o.start(t);o.stop(t+dur+.03);
  }
  function note(f,dur,type,vol,when,dest,att){
    if(!ctx)return;const t=ctx.currentTime+(when||0);
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);
    const a=att||.01;
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(dest||musG);o.start(t);o.stop(t+dur+.05);
  }
  function noise(dur,vol,f0,f1,type,when,dest){
    if(!ctx)return;const t=ctx.currentTime+(when||0);
    const s=ctx.createBufferSource();s.buffer=noiseBuf;s.loop=true;
    const fl=ctx.createBiquadFilter();fl.type=type||'lowpass';fl.frequency.setValueAtTime(f0,t);
    if(f1)fl.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
    const g=ctx.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(fl);fl.connect(g);g.connect(dest||sfxG);s.start(t,Math.random()*.5);s.stop(t+dur+.03);
  }
  function thr(n,ms){const t=performance.now();if(last[n]&&t-last[n]<ms)return false;last[n]=t;return true;}
  const sfx={
    sword(){if(!thr('sword',80))return;noise(.14,.18,3500,700,'bandpass');tone(500,.1,'triangle',.06,260);},
    hit(){if(!thr('hit',40))return;tone(180,.09,'square',.12,90);noise(.07,.12,2200,500);},
    clink(){tone(1500,.08,'triangle',.12,900);tone(2300,.06,'square',.05,1800);},
    kill(){tone(400,.18,'square',.1,80);noise(.2,.16,2500,300);},
    hurt(){if(!thr('hurt',150))return;tone(330,.3,'sawtooth',.2,80);noise(.18,.18,1400,200);},
    pick(){tone(880,.07,'square',.09);tone(1320,.1,'square',.09,0,.06);},
    heart(){tone(660,.1,'triangle',.18);tone(990,.14,'triangle',.18,0,.09);},
    rupee(){tone(1100,.06,'square',.08);tone(1650,.09,'square',.08,0,.05);},
    cut(){if(!thr('cut',50))return;noise(.12,.15,5000,1500,'highpass');},
    step(){if(!thr('step',200))return;noise(.04,.02,600,300);},
    shoot(){tone(700,.1,'triangle',.1,200);noise(.08,.07,3000,800,'bandpass');},
    arrowhit(){tone(300,.05,'square',.08,150);},
    bomb(){noise(.9,.5,2800,40);tone(160,.7,'sawtooth',.25,28);tone(60,.8,'sine',.4,25);},
    fuse(){tone(1800,.4,'sawtooth',.03,2400);},
    open(){tone(220,.15,'square',.1,330);tone(330,.15,'square',.1,440,.12);tone(440,.2,'square',.1,660,.24);},
    door(){noise(.4,.15,500,100);tone(90,.35,'sawtooth',.12,60);},
    unlock(){tone(900,.05,'square',.1);tone(600,.2,'triangle',.14,300,.05);},
    chest(){[523,659,784,1047].forEach((f,i)=>tone(f,.18,'square',.08,0,i*.1));},
    get(){[523,659,784,659,784,1047,1319].forEach((f,i)=>{tone(f,.2,'square',.09,0,i*.12);tone(f/2,.2,'triangle',.1,0,i*.12);});},
    text(){if(!thr('text',45))return;tone(520+Math.random()*80,.03,'square',.03);},
    ui(){tone(700,.05,'square',.06,1000);},
    ok(){tone(500,.06,'square',.07,800);tone(800,.08,'square',.07,1100,.06);},
    push(){if(!thr('push',140))return;noise(.1,.1,300,150);},
    fall(){tone(600,.5,'sine',.15,60);},
    switch(){tone(1200,.1,'triangle',.14,2000);tone(1700,.2,'triangle',.1,2600,.07);},
    roar(){noise(.9,.35,900,100);tone(80,.9,'sawtooth',.25,40);},
    rootup(){noise(.25,.2,700,200);tone(70,.25,'square',.12,50);},
    warn(){tone(300,.3,'sawtooth',.1,200);},
    over(){[392,330,262,196,147].forEach((f,i)=>tone(f,.5,'sawtooth',.14,f*.95,i*.3));},
    win(){[523,659,784,1047,784,1047,1319,1568].forEach((f,i)=>{tone(f,.35,'square',.08,0,i*.16);tone(f/2,.4,'triangle',.12,0,i*.16);});},
    quake(){noise(1.2,.3,300,60);tone(45,1.2,'sine',.4,30);}
  };
  /* ---- музика: тема на зона ---- */
  const SC={maj:[0,2,4,5,7,9,11],min:[0,2,3,5,7,8,10],dor:[0,2,3,5,7,9,10],pent:[0,2,4,7,9],mixo:[0,2,4,5,7,9,10]};
  const TR=[
   {name:'title',bpm:78,root:57,sc:'min',lead:'triangle',pad:'sine',bass:'triangle',dens:.55,prog:[0,5,3,4]},
   {name:'village',bpm:108,root:62,sc:'maj',lead:'triangle',pad:'sine',bass:'triangle',dens:.7,prog:[0,4,5,3]},
   {name:'field',bpm:100,root:60,sc:'mixo',lead:'square',pad:'triangle',bass:'triangle',dens:.6,prog:[0,3,4,0]},
   {name:'forest',bpm:84,root:55,sc:'dor',lead:'triangle',pad:'sine',bass:'sine',dens:.5,prog:[0,6,5,3]},
   {name:'dungeon',bpm:74,root:50,sc:'min',lead:'sawtooth',pad:'sine',bass:'triangle',dens:.34,prog:[0,0,5,4]},
   {name:'boss',bpm:140,root:48,sc:'min',lead:'sawtooth',pad:'sawtooth',bass:'square',dens:.8,prog:[0,5,4,3]},
   {name:'house',bpm:92,root:64,sc:'pent',lead:'triangle',pad:'sine',bass:'sine',dens:.45,prog:[0,2,3,1]},
   {name:'win',bpm:112,root:60,sc:'maj',lead:'square',pad:'triangle',bass:'triangle',dens:.8,prog:[0,5,3,4]}
  ];
  const M={want:-1,cur:-1,timer:null,step:0,next:0,rng:mulberry(7)};
  function degree(tr,d,oct){const s=SC[tr.sc];const n=s.length;const o=Math.floor(d/n);return tr.root+s[((d%n)+n)%n]+12*(o+(oct||0));}
  function startMusic(){
    if(!ctx||M.cur===M.want)return;
    M.cur=M.want;M.step=0;M.next=ctx.currentTime+.1;M.rng=mulberry(1000+M.cur*13);
    if(!M.timer)M.timer=setInterval(pump,60);
  }
  function pump(){
    if(!ctx||M.cur<0||!st.mus){return;}
    const tr=TR[M.cur];if(!tr)return;
    const sd=60/tr.bpm/2; // 8-ки
    while(M.next<ctx.currentTime+.35){
      const when=M.next-ctx.currentTime;const s=M.step;
      const bar=Math.floor(s/16)%tr.prog.length,pos=s%16;
      const ch=tr.prog[bar];
      if(pos%8===0){ // пад акорд
        [0,2,4].forEach((o,i)=>note(midi(degree(tr,ch+o,0)),sd*8.5,tr.pad,.045,when,null,.25));
      }
      if(pos%4===0&&(M.cur!==4||pos%8===0))note(midi(degree(tr,ch,-2)),sd*3.2,tr.bass,.11,when);
      if(M.cur===5&&pos%2===1)note(midi(degree(tr,ch,-2)),sd*.8,'square',.05,when);
      if(M.rng()<tr.dens*(pos%2===0?1:.6)){
        const w=[0,1,2,4,2,1,3,5,4,2,1,0,2,4,6,4];
        let d=ch+w[(pos+(bar*5))%16]+(M.rng()<.25?2:0);
        note(midi(degree(tr,d,1)),sd*(M.rng()<.3?3:1.6),tr.lead,.05,when);
      }
      if(M.cur===5&&pos%4===0)noise(.06,.06,6000,3000,'highpass',when,musG);
      if(M.cur===5&&pos%8===4)noise(.14,.12,1500,200,'lowpass',when,musG);
      M.step++;M.next+=sd;
    }
  }
  return{
    init,sfx(n,a){if(!ctx||!st.sfx)return;const f=sfx[n];if(f)try{f(a);}catch(e){}},
    music(i){M.want=i;if(ctx){if(M.cur!==i){M.cur=-2;startMusic();}}},
    stopMusic(){M.want=-1;M.cur=-1;},
    setSfx(v){st.sfx=v;if(sfxG)sfxG.gain.value=v?.9:0;save();},
    setMus(v){st.mus=v;if(musG)musG.gain.value=v?.5:0;save();},
    st,get ready(){return !!ctx;}
  };
})();

'use strict';
/* ===== Данни: карти, свят, диалози ===== */
const SOLID=new Set('Tt#~FBhnrwkcCoxuKHmqYXWDGZNg'.split('')); // X/W са дупки (не твърди, но падане)
for(const c of 'XW'.split(''))SOLID.delete(c);
const CUTTABLE={',':'.','t':'.','o':'_'};
const maps={};
const DOORS=[]; // {m,x,y,to,tx,ty}
const addDoor=(m,x,y,to,tx,ty,face)=>DOORS.push({m,x,y,to,tx,ty,face:face==null?3:face});

function newGrid(w,h,ch){const g=[];for(let y=0;y<h;y++)g.push(new Array(w).fill(ch));return g;}
function setT(g,x,y,ch){if(y>=0&&y<g.length&&x>=0&&x<g[0].length)g[y][x]=ch;}
function fill(g,x0,y0,w,h,ch){for(let y=y0;y<y0+h;y++)for(let x=x0;x<x0+w;x++)setT(g,x,y,ch);}
function house(g,x,y,w,doorDx){ // покрив 2 реда + стена
  fill(g,x,y,w,2,'r');fill(g,x,y+2,w,1,'h');
  for(let i=1;i<w-1;i+=2)if(i!==doorDx)setT(g,x+i,y+2,'n');
  setT(g,x+doorDx,y+2,'d');
}
/* --- шум за генерация --- */
function vnoise(x,y,sc,seed){
  const fx=x/sc,fy=y/sc,x0=Math.floor(fx),y0=Math.floor(fy),tx=fx-x0,ty=fy-y0;
  const s=t=>t*t*(3-2*t);
  const a=hash2(x0,y0,seed),b=hash2(x0+1,y0,seed),c=hash2(x0,y0+1,seed),d=hash2(x0+1,y0+1,seed);
  return lerp(lerp(a,b,s(tx)),lerp(c,d,s(tx)),s(ty));
}

/* ================= ГОЛЕМИЯТ СВЯТ ================= */
const OW=120,OH=66;
const VIL={x:40,y:44};      // село Росна (2 стаи)
const TEMPLE_DOOR={x:70,y:14};
function carve(g,x0,y0,x1,y1,wd,ch,seed){ // криволичещ път
  let x=x0,y=y0;const r=mulberry(seed||5);
  const stepsMax=800;
  for(let i=0;i<stepsMax&&(x!==x1||y!==y1);i++){
    for(let dy=0;dy<wd;dy++)for(let dx=0;dx<wd;dx++){const t=g[y+dy]&&g[y+dy][x+dx];if(t&&t!=='#')setT(g,x+dx,y+dy,t==='~'?'j':ch);}
    const ax=Math.abs(x1-x),ay=Math.abs(y1-y);
    let horiz=ax>ay?r()<.8:r()<.25; if(ax===0)horiz=false; if(ay===0)horiz=true;
    if(horiz)x+=Math.sign(x1-x);else y+=Math.sign(y1-y);
  }
  for(let dy=0;dy<wd;dy++)for(let dx=0;dx<wd;dx++){const t=g[y1+dy]&&g[y1+dy][x1+dx];if(t&&t!=='#')setT(g,x1+dx,y1+dy,t==='~'?'j':ch);}
}
function genOver(){
  const g=newGrid(OW,OH,'.');
  const R=mulberry(2024);
  for(let y=0;y<OH;y++)for(let x=0;x<OW;x++){
    const f=vnoise(x,y,9,11),f2=vnoise(x,y,5,21),l=vnoise(x,y,12,31),m=vnoise(x,y,7,41);
    let c='.';
    if(f>.60)c=(f2>.45?'T':'t');
    else if(f2>.66)c=',';
    else if(m>.70)c='f';
    if(l>.72)c='~';else if(l>.68&&c!=='T')c='S';
    g[y][x]=c;
  }
  /* планини на север и изток, граница */
  for(let y=0;y<OH;y++)for(let x=0;x<OW;x++){
    const n=vnoise(x,y,6,51);
    const edge=Math.min(x,y,OW-1-x,OH-1-y);
    const north=y<6+n*4, east=x>OW-8-n*4&&y<46;
    if(edge<2||north||east)g[y][x]='#';
    else if(edge<4&&g[y][x]!=='~')g[y][x]=(hash2(x,y,3)<.6?'T':'t');
  }
  /* скален пояс, който дели света на юг (село) и север (гора/храм); единствен проход – портата */
  const GX=VIL.x+19;
  for(let x=0;x<OW;x++){const t0=29+Math.round(vnoise(x,0,8,61)*3);for(let y=t0;y<t0+3;y++)g[y][x]='#';}
  /* --- село --- */
  const vx=VIL.x,vy=VIL.y;
  fill(g,vx,vy,40,11,'.');
  for(let y=0;y<11;y++)for(let x=0;x<40;x++){
    const r=hash2(x,y,77);
    if(y<=1||y>=10||x<=1||x>=38){if(r<.55)setT(g,vx+x,vy+y,'T');else if(r<.8)setT(g,vx+x,vy+y,'t');}
    else if(r<.07)setT(g,vx+x,vy+y,'f');
    else if(r<.1)setT(g,vx+x,vy+y,',');
  }
  fill(g,vx,vy+6,40,2,'p');                       // улица
  fill(g,vx+19,vy,2,6,'p');                        // път на север
  fill(g,vx+19,vy+8,2,3,'p');                      // юг
  /* къщи (врати към улицата) */
  const hs=[[5,2,6,2],[12,2,5,2],[23,2,6,2],[30,2,6,2]];
  for(const [x,y,w,dd] of hs){house(g,vx+x,vy+y,w,dd);setT(g,vx+x+dd,vy+y+3,'p');}
  /* огради, кладенец, табели */
  setT(g,vx+22,vy+9,'w');
  setT(g,vx+17,vy+5,'k');                          // табела
  setT(g,vx+9,vy+5,'k');
  for(let x=2;x<=3;x++)setT(g,vx+x,vy+9,'F');
  /* --- път от селото към прохода --- */
  carve(g,GX,vy+2,GX,34,2,'p',9);
  fill(g,GX,29,2,6,'p');
  /* порта: 2 фенса */
  /* --- пътека на север към храма --- */
  carve(g,GX,28,66,24,2,'p',5);
  carve(g,66,24,70,17,3,'p',4);
  /* --- храм: поляна и вход --- */
  const tx0=60,ty0=11;
  fill(g,tx0,ty0,20,11,'.');
  fill(g,tx0,ty0,20,3,'#');
  fill(g,tx0+2,ty0+3,16,8,'.');

'use strict';
/* ===== Играта: състояние, свят, обекти, бой ===== */
const G={mode:'title',flags:{},inv:null,mapId:'over',map:null,tiles:null,P:null,E:[],I:[],PR:[],FX:[],NPC:[],BL:[],
  room:{rx:0,ry:0},cam:{x:0,y:0},scroll:null,fade:null,dialog:null,time:0,shake:0,locked:false,
  visited:{},msg:null,spawnPos:null,lastSave:0,hint:null,swapT:0,pauseTab:0,menuSel:0,deadT:0,playT:0,itemGet:null,
  checkpoint:null,titleSel:0,endT:0,timers:[]};
G.flags=G.flags||{};
const fl=k=>!!G.flags[k];
function setFlag(k,v){G.flags[k]=(v===undefined?1:v);}
function newInv(){return{sword:false,bow:false,bombBag:false,bombs:0,arrows:0,keys:0,bosskey:false,rupees:0,hp:6,maxHp:6,pieces:0,shards:0,sel:'bomb',dmg:1};}

/* ---------- Плочки ---------- */
function tileAt(x,y){if(y<0||x<0||y>=G.map.h||x>=G.map.w)return '#';return G.tiles[y][x];}
function setTile(x,y,ch,persist){if(y<0||x<0||y>=G.map.h||x>=G.map.w)return;G.tiles[y][x]=ch;if(persist)G.flags['t:'+G.mapId+':'+x+','+y]=ch;}
function isGap(x,y){ // входове между стаи – заключват се при бой
  if(!G.map.rooms)return false;const lx=x%RW,ly=y%RH;
  return (ly===5&&(lx===0||lx===RW-1))||((ly===0||ly===RH-1)&&(lx===9||lx===10));
}
function roomKey(){return G.room.rx+','+G.room.ry;}
function tileSolid(ch,x,y,flier){
  if(ch==='N')return !fl('d1_puzzle');
  if(ch==='W'&&!flier)return !fl('d1_crystal')?false:false;
  if(SOLID.has(ch))return true;
  if(G.locked&&isGap(x,y)&&tileAtRaw(x,y)!=='v')return true;
  return false;
}
function tileAtRaw(x,y){return G.tiles[y]&&G.tiles[y][x];}
function solidTile(x,y,flier){
  const ch=tileAt(x,y);
  if(tileSolid(ch,x,y,flier))return true;
  if(!flier&&(ch==='X'||(ch==='W'&&!fl('d1_crystal'))))return 'pit';
  return false;
}
function hasBlockAt(tx,ty){for(const b of G.BL)if(b.tx===tx&&b.ty===ty)return b;return null;}

/* ---------- Движение с колизии ---------- */
function moveBox(e,dx,dy,mode){ // mode: 'walk' (пита = твърда за врагове), 'fly'
  const hw=e.w/2,hh=e.h/2;let hit=false;
  const blocked=(x,y)=>{
    const x0=Math.floor((x-hw)/TS),x1=Math.floor((x+hw-.01)/TS),y0=Math.floor((y-hh)/TS),y1=Math.floor((y+hh-.01)/TS);
    for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
      const s=solidTile(tx,ty,mode==='fly');
      if(s===true)return true;
      if(s==='pit'&&mode==='walk')return true;
      if(hasBlockAt(tx,ty)&&!e.noBlock)return true;
    }
    return false;
  };
  let nx=e.x+dx;if(blocked(nx,e.y)){hit=true;nx=e.x;const step=Math.sign(dx);let moved=0;const tot=Math.abs(dx);while(moved<tot){const s=Math.min(1,tot-moved);if(blocked(e.x+step*(moved+s),e.y))break;moved+=s;}nx=e.x+step*moved;}
  e.x=nx;
  let ny=e.y+dy;if(blocked(e.x,ny)){hit=true;ny=e.y;const step=Math.sign(dy);let moved=0;const tot=Math.abs(dy);while(moved<tot){const s=Math.min(1,tot-moved);if(blocked(e.x,e.y+step*(moved+s)))break;moved+=s;}ny=e.y+step*moved;}
  e.y=ny;return hit;
}
function boxOverlapsSolid(x,y,w,h,mode){
  const hw=w/2,hh=h/2;
  const x0=Math.floor((x-hw)/TS),x1=Math.floor((x+hw-.01)/TS),y0=Math.floor((y-hh)/TS),y1=Math.floor((y+hh-.01)/TS);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){const s=solidTile(tx,ty,mode==='fly');if(s===true||(s==='pit'&&mode==='walk'))return true;if(hasBlockAt(tx,ty))return true;}
  return false;
}
function unstick(e){
  if(!boxOverlapsSolid(e.x,e.y,e.w,e.h,'walk'))return;
  for(let r=2;r<120;r+=2)for(let a=0;a<16;a++){const x=e.x+Math.cos(a/16*TAU)*r,y=e.y+Math.sin(a/16*TAU)*r;if(!boxOverlapsSolid(x,y,e.w,e.h,'walk')){e.x=x;e.y=y;return;}}
}

/* ---------- Ефекти ---------- */
function fx(type,x,y,o){G.FX.push(Object.assign({type,x,y,t:0,life:.5,vx:0,vy:0,c:'#fff',s:3},o||{}));if(G.FX.length>400)G.FX.splice(0,60);}

/* ---------- Диалози ---------- */
function say(lines,cb,speaker){
  const arr=(typeof lines==='function'?lines():lines).slice();
  G.dialog={lines:arr,i:0,shown:0,cb:cb||null,speaker:speaker||null,choice:null,sel:0,t:0};
  G.prevMode=G.mode==='dialog'?G.prevMode:G.mode;G.mode='dialog';
  nextLineInit();
}
function curLine(){const d=G.dialog;const l=d.lines[d.i];return typeof l==='string'?{t:l}:l;}
function nextLineInit(){const d=G.dialog;d.shown=0;d.choice=null;const l=curLine();if(l.ch){d.sel=0;}if(l.fn)l.fn();}
function endDialog(){const d=G.dialog;G.dialog=null;G.mode=G.prevMode&&G.prevMode!=='dialog'?G.prevMode:'play';if(G.mode==='dialog')G.mode='play';if(d&&d.cb)d.cb();}
function updateDialog(dt){
  const d=G.dialog;if(!d)return;const l=curLine();
  const total=l.t.length;
  if(d.shown<total){d.shown=Math.min(total,d.shown+dt*55);Snd.sfx('text');if(INP.aP||INP.bP){d.shown=total;}return;}
  if(l.ch){
    if(INP.upP)d.sel=(d.sel+l.ch.length-1)%l.ch.length;
    if(INP.downP)d.sel=(d.sel+1)%l.ch.length;
    if(INP.aP){const c=l.ch[d.sel];Snd.sfx('ui');
      if(c[1]==='close'){advanceDialog();}
      else{const res=c[1]();if(res){G.dialog.lines=res.slice();G.dialog.i=0;nextLineInit();}else advanceDialog();}}
    return;}
  if(INP.aP||INP.bP){Snd.sfx('ui');advanceDialog();}
}
function advanceDialog(){const d=G.dialog;d.i++;if(d.i>=d.lines.length){endDialog();}else nextLineInit();}

/* ---------- Предмети и инвентар ---------- */
function giveItem(it,n){
  const I=G.inv;
  switch(it){
    case 'sword':I.sword=true;return{name:'РОДОВ МЕЧ',txt:'Натисни А, за да замахнеш! Тревата и храстите се режат с него.'};
    case 'bow':I.bow=true;I.arrows=Math.max(I.arrows,20);I.sel='bow';return{name:'ЛЪК ОТ КОРЕНИ',txt:'Избери го с ⇄ и стреляй с B. Може да удря далечни кристали!'};
    case 'bombs':I.bombBag=true;I.bombs=Math.min(30,I.bombs+(n||5));return{name:'БОМБИ',txt:'Стреляй с B. Пукнатите скали се отварят с бомба!'};
    case 'key':I.keys++;return{name:'МАЛЪК КЛЮЧ',txt:'Отваря заключена врата.'};
    case 'bosskey':I.bosskey=true;return{name:'КЛЮЧ НА ПАЗИТЕЛЯ',txt:'Отваря вратата на главната зала.'};
    case 'piece':I.pieces++;if(I.pieces>=4){I.pieces-=4;I.maxHp+=2;I.hp=I.maxHp;return{name:'ЧАСТ ОТ СЪРЦЕ',txt:'Четири части станаха ново сърце! Здравето е пълно.'};}return{name:'ЧАСТ ОТ СЪРЦЕ ('+I.pieces+'/4)',txt:'Събери четири, за да получиш ново сърце.'};
    case 'container':I.maxHp+=2;I.hp=I.maxHp;return{name:'СЪРЦЕ-КОНТЕЙНЕР',txt:'Максималното здраве нарасна!'};
    case 'rupees':I.rupees=Math.min(999,I.rupees+(n||1));return{name:n+' КРИСТАЛА',txt:'Блестящи кристалчета — с тях се купува в магазина.'};
    case 'shard':I.shards++;return{name:'ПАРЧЕ ОТ ЛУННИЯ КРИСТАЛ',txt:'Топла светлина изпълва ръцете ти...'};
  }
  return{name:it,txt:''};
}
function itemGet(it,n,after_){
  const r=giveItem(it,n);const big=(it==='sword'||it==='bow'||it==='shard'||it==='container'||it==='piece'||it==='bosskey'||it==='key'||it==='bombs');
  Snd.sfx(it==='key'?'unlock':'get');
  G.itemGet={it,r,t:0,after:after_};G.mode='item';G.P.carry=it==='container'||it==='piece'||it==='shard'?it:it;
  }
function updateItemGet(dt){
  const g=G.itemGet;g.t+=dt;
  if(g.t>.9&&!g.said){g.said=true;say(['Получи: '+g.r.name+'!',g.r.txt],()=>{G.itemGet=null;G.P.carry=null;G.mode='play';if(g.after)g.after();});G.prevMode='item';}
}
function addRupees(n){G.inv.rupees=Math.min(999,G.inv.rupees+n);Snd.sfx('rupee');}
function heal(n){const I=G.inv;I.hp=Math.min(I.maxHp,I.hp+n);Snd.sfx('heart');}
function dropFrom(x,y,table){
  const r=Math.random();let t=table||[[.18,'heart'],[.40,'rupee'],[.46,'rupee5'],[.54,G.inv.bombBag?'bomb':null],[.62,G.inv.bow?'arrow':null]];
  let acc=0;for(const [p,it] of t){if(r<p){if(it)spawnItem(it,x,y);return;}}
}
function spawnItem(type,x,y,o){G.I.push(Object.assign({type,x,y,w:14,h:14,t:0,vy:-60,z:0,life:type==='heart'||type==='rupee'||type==='rupee5'||type==='arrow'||type==='bomb'?14:1e9,bx:x,by:y},o||{}));}
function collectItem(it){

function onShard(){

  say(['Лунният кристал отново свети... слабо, но истински.','В далечината се чува ужасен рев: Малгор разбра, че първото парче е изгубено.','(Върни се в Росна и говори със Старейшината. Можеш да продължиш да изследваш света.)'],()=>{G.flags.warp=1;spawnWarp();});

function spawnWarp(){const cx=G.room.rx*VW+VW/2,cy=G.room.ry*VH+VH/2;G.I.push({type:'warp',x:cx,y:cy+60,w:34,h:34,t:0,life:1e9});}

/* ---------- Зареждане на карта ---------- */
function loadMap(id,tx,ty,dir,opts){

  G.tiles=m.t.map(r=>r.slice());

  /* динамични стартови промени */
  if(id==='over'){const gx=VIL.x+19;if(!fl('elder_quest')){G.tiles[31][gx]='F';G.tiles[31][gx+1]='F';}else{for(const xx of [gx,gx+1])if(G.tiles[31][xx]==='F')G.tiles[31][xx]='p';}}
  const P=G.P||(G.P=newPlayer());

  P.vx=P.vy=0;P.swing=0;P.inv=0;P.fall=0;P.push=0;
  G.locked=false;G.E=[];G.I=[];G.PR=[];G.BL=[];G.NPC=[];G.scroll=null;G.titleCam=null;

function musicFor(){
  if(G.mapId==='dun1'){return (G.room.rx===3&&G.room.ry===1&&!fl('d1_done'))?5:4;}
  if(G.mapId==='over'){
    const px=G.P.x/TS,py=G.P.y/TS;
    if(px>=VIL.x&&px<VIL.x+40&&py>=VIL.y&&py<VIL.y+11)return 1;
    if(py<30&&px>50&&px<90)return 3;
    return 2;
  }
  if(G.mapId==='cave1')return 4;

}
function newPlayer(){return{x:0,y:0,w:16,h:14,dir:0,vx:0,vy:0,anim:0,moving:false,swing:0,swingT:0,hasSword:true,inv:0,fall:0,carry:null,kb:0,push:0,hit:null,spd:104};}
function roomOfPos(x,y){return{rx:Math.floor(x/VW),ry:Math.floor(y/VH)};}
function enterRoom(initial){
  const P=G.P;const r=roomOfPos(P.x,P.y);G.room=r;
  const vk=G.mapId;(G.visited[vk]||(G.visited[vk]={}))[r.rx+','+r.ry]=1;
  G.E=[];G.NPC=[];G.BL=[];G.PR=G.PR.filter(p=>p.type==='bombE');G.I=G.I.filter(i=>i.type==='warp'||false);
  G.locked=false;
  const m=G.map;
  /* НПС */
  const addNpc=n=>{const e=Object.assign({kind:'npc',w:16,h:12,dir:0,t:0,anim:0},n);e.x=n.x*TS+TS/2;e.y=n.y*TS+TS/2+4;G.NPC.push(e);};
  if(G.mapId==='over'){
    for(const n of overNpcs()){if(Math.floor(n.x/RW)===r.rx&&Math.floor(n.y/RH)===r.ry)addNpc(n);}
  }else{
    for(const n of m.npcs){if(n.id==='elder'&&G.mapId==='house2'&&!fl('elder_home')&&false)continue;addNpc(n);}
    if(G.mapId==='house1'&&fl('intro')&&!fl('elder_quest'))addNpc({id:'elderv',x:10,y:7,look:'elder',lines:elderVisit});
  }
  /* врагове */
  if(G.mapId==='over'){
    if(initial&&opts_noSpawn)return;
    for(const s of overSpawns(r.rx,r.ry))spawnEnemy(s[0],s[1]*TS+TS/2,s[2]*TS+TS/2);
  }else if(G.mapId==='dun1'){
    const key=r.rx+','+r.ry;

    const cleared=fl('d1c:'+key);

function overSpawns(rx,ry){
  const out=[];
  const dv=Math.hypot(rx-2.5,ry-4.2);
  if(rx>=2&&rx<=3&&ry===4)return out;
  const n=Math.min(5,Math.max(1,Math.round(dv*.8+(hash2(rx,ry,5)*2))));
  const R=mulberry(rx*977+ry*331+7);
  let tries=0;
  while(out.length<n&&tries<60){tries++;
    const lx=2+Math.floor(R()*(RW-4)),ly=2+Math.floor(R()*(RH-4));const gx=rx*RW+lx,gy=ry*RH+ly;
    const ch=G.tiles[gy][gx];if(ch==='#'||ch==='~'||ch==='T'||ch==='t'||ch==='F'||ch==='p')continue;
    if(Math.hypot(gx*TS+16-G.P.x,gy*TS+16-G.P.y)<150)continue;
    let ty='slime';const nearT=(()=>{let c=0;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const t=G.tiles[gy+dy]&&G.tiles[gy+dy][gx+dx];if(t==='T'||t==='#')c++;}return c;})();
    const q=R();
    if(ry<=2&&q<.4)ty='bat';else if(nearT>5&&q<.5)ty='bat';else if(dv>2.2&&q<.5)ty='goblin';else if(q<.12)ty='bat';
    out.push([ty,gx-rx*RW,gy-ry*RH].map((v,i)=>i===0?v:v+rx*RW*(i===1?1:0)+ry*RH*(i===2?1:0)));
  }
  return out;
}

function updateEnemies(dt){

function aiSlime(e,dt){

function aiGoblin(e,dt){

    /* заглежда играча по права линия */
    const aligned=(Math.abs(dy)<20&&Math.abs(dx)<220)||(Math.abs(dx)<20&&Math.abs(dy)<220);
    if(aligned&&e.spawnT<=0){e.face=Math.abs(dx)>Math.abs(dy)?(dx<0?1:2):(dy<0?3:0);e.state='wind';e.st=.4;Snd.sfx('warn');}
  }else if(e.state==='wind'){e.moving=false;if(e.st<=0){e.state='charge';e.st=.7;}}
  else if(e.state==='charge'){const [vx,vy]=DIRS[e.face];if(moveBox(e,vx*150*dt,vy*150*dt,'walk')){e.state='stun';e.st=.9;Snd.sfx('clink');burst(e.x+vx*16,e.y+vy*12,6,'#fff',60,.3);}if(e.st<=0){e.state='idle';e.st=.4;}}

/* --- Корнегрив --- */
function aiBoss(e,dt){
  const P=G.P;const ph2=e.phase===2;
  e.st-=dt;
  if(e.state==='intro'){ // кадри на реве
    e.vul=false;if(e.st<=0){e.state='idle';e.st=1.2;}
    return;}
  if(e.state==='idle'){
    e.vul=false;
    const tx=clamp(P.x,G.room.rx*VW+130,G.room.rx*VW+VW-130);e.x+=clamp(tx-e.x,-1,1)*Math.min(Math.abs(tx-e.x),(ph2?60:38)*dt)*1;
    if(e.st<=0){
      e.attackN++;const q=e.attackN%(ph2?4:3);
      if(q===1){e.state='roots';e.st=2.0;e.roots=[];const n=ph2?5:3;for(let i=0;i<n;i++){const ang=Math.random()*TAU,r=i===0?0:40+Math.random()*110;e.roots.push({x:clamp(P.x+Math.cos(ang)*r,G.room.rx*VW+60,G.room.rx*VW+VW-60),y:clamp(P.y+Math.sin(ang)*r*.6,G.room.ry*VH+90,G.room.ry*VH+VH-60),t:-i*.28,hit:false});}Snd.sfx('warn');}
      else if(q===2){e.state='seeds';e.st=1.0;e.fired=0;}
      else if(q===0){e.state='summon';e.st=1.3;}
      else{e.state='roots';e.st=1.8;e.roots=[];for(let i=0;i<6;i++)e.roots.push({x:G.room.rx*VW+80+i*96,y:clamp(P.y,G.room.ry*VH+100,G.room.ry*VH+VH-70),t:-i*.18,hit:false});Snd.sfx('warn');}
    }
  }
  else if(e.state==='roots'){
    e.vul=false;
    for(const r of e.roots){r.t+=dt;
      if(r.t>=.9&&!r.fired){r.fired=true;Snd.sfx('rootup');burst(r.x,r.y,10,['#7a4c28','#3a2410'],110,.5,3);G.shake=.1;}
      if(r.fired&&r.t<1.35&&!r.hit&&Math.hypot(P.x-r.x,(P.y-r.y)*1.2)<28){r.hit=true;hurtPlayer(2,r.x,r.y,200);}}
    if(e.st<=0){e.state='stun';e.st=ph2?2.4:3.0;e.vul=true;Snd.sfx('roar');}
  }
  else if(e.state==='seeds'){
    e.vul=false;e.fireT=(e.fireT||0)-dt;
    if(e.st<.6&&e.fired<3&&e.fireT<=0){e.fireT=.22;e.fired++;const a=Math.atan2(P.y-e.y,P.x-e.x);const n=ph2?5:3;for(let i=0;i<n;i++){const aa=a+(i-(n-1)/2)*.28;G.PR.push({type:'seed',x:e.x,y:e.y+10,vx:Math.cos(aa)*150,vy:Math.sin(aa)*150,w:10,h:10,life:3,team:'e',dmg:1});}Snd.sfx('shoot');}
    if(e.st<=0){e.state='idle';e.st=ph2?.8:1.3;}
  }
  else if(e.state==='summon'){
    e.vul=false;if(e.st<=1&&!e.sumd){e.sumd=true;if(G.E.filter(x=>x.type!=='boss').length<3){const t=ph2?'bat':'slime';for(let i=0;i<2;i++){const s=spawnEnemy(t,e.x+(i?-70:70),e.y+60);}burst(e.x,e.y+50,14,'#caa0ff',80,.6);Snd.sfx('roar');}}
    if(e.st<=0){e.sumd=false;e.state='idle';e.st=ph2?.7:1.2;}
  }
  else if(e.state==='stun'){
    e.vul=true;if(e.st<=0){e.vul=false;e.state='idle';e.st=ph2?.7:1.1;}
  }
}

'use strict';
/* ===== Обновяване: играч, снаряди, предмети, стая, преходи ===== */
function updatePlayer(dt){
  const P=G.P,I=G.inv;
  if(P.inv>0)P.inv-=dt;
  if(P.kb>0){P.kb-=dt;moveBox(P,P.kvx*dt,P.kvy*dt,'walk');}
  const busy=P.swing>0;
  let mx=INP.dx,my=INP.dy;
  if(P.fall>0){P.fall-=dt;if(P.fall<=0){P.x=P.safe.x;P.y=P.safe.y;hurtPlayerRaw(1);P.inv=1;}return;}
  const spd=P.spd*(busy?.45:1);
  P.moving=(mx||my)&&P.kb<=0;
  if(P.moving&&P.kb<=0){
    const l=Math.hypot(mx,my);mx/=Math.max(1,l);my/=Math.max(1,l);
    if(!busy||true){if(!busy)P.dir=dirOf(mx,my);}
    const hit=moveBox(P,mx*spd*dt,my*spd*dt,'walk');
    P.anim+=dt*8;
    Snd.sfx('step');
    /* бутане на блокове */
    if(hit){
      const [fx_,fy_]=[P.x+DIRS[P.dir][0]*(P.w/2+3),P.y+DIRS[P.dir][1]*(P.h/2+3)];
      const bt=hasBlockAt(Math.floor(fx_/TS),Math.floor(fy_/TS));
      if(bt&&!bt.mt){P.push+=dt;if(P.push>.4){pushBlock(bt,P.dir);P.push=0;}Snd.sfx('push');}else P.push=0;
    }else P.push=0;
  }else{P.anim=0;P.push=0;}
  /* меч */
  if(P.swing>0){
    P.swingT+=dt;const dur=P.bow?.2:.26;P.swing=Math.min(1,P.swingT/dur);
    if(!P.bow)swordHit();
    if(P.swingT>=dur){P.swing=0;P.bow=false;}
  }
  if(!busy&&INP.aP){if(!tryInteract())swingSword();}
  if(!busy&&INP.bP)useItem();
  if(INP.swP)cycleItem();
  /* плочки под краката */
  const tx=Math.floor(P.x/TS),ty=Math.floor(P.y/TS);const ch=tileAt(tx,ty);
  if(ch==='X'||(ch==='W'&&!fl('d1_crystal'))){ // падане
    if(!P.fall){P.fall=.7;Snd.sfx('fall');}
  }else if(P.kb<=0&&!P.fall&&P.safeT!==undefined)P.safeT-=dt;
  if(!P.fall&&!G.scroll&&P.kb<=0){ // безопасна позиция
    const okc=ch!=='X'&&ch!=='W'&&ch!=='^';
    P.safeT=(P.safeT||0)-dt;if(okc&&P.safeT<=0){P.safe={x:P.x,y:P.y};P.safeT=.25;}
  }
  if(ch==='^')hurtPlayer(1,P.x,P.y+8,160);
  /* врати/входове */
  if(ch==='d'||ch==='v'){const dr=DOORS.find(d=>d.m===G.mapId&&d.x===tx&&d.y===ty);if(dr)doTransition(dr);}
  /* заключени врати */
  const [fx2,fy2]=frontTile();const fch=tileAt(fx2,fy2);
  if((fch==='D'||fch==='G')&&P.moving){
    if(fch==='D'&&I.keys>0){I.keys--;openDoorFlood(fx2,fy2,'D');Snd.sfx('unlock');}
    else if(fch==='G'&&I.bosskey){openDoorFlood(fx2,fy2,'G');Snd.sfx('unlock');}
    else if(!P.noKeyMsg||G.time-P.noKeyMsg>2){P.noKeyMsg=G.time;floatText(P.x,P.y-40,fch==='D'?'Нужен е малък ключ':'Нужен е ключ на пазителя','#ffd0d0');Snd.sfx('clink');}
  }
  /* смяна на стая */
  const rr_=roomOfPos(P.x,P.y);
  if(G.map.rooms&&(rr_.rx!==G.room.rx||rr_.ry!==G.room.ry)&&!G.locked)startScroll(rr_);
  else if(!G.map.rooms&&G.mapId==='over'&&(rr_.rx!==G.room.rx||rr_.ry!==G.room.ry))startScroll(rr_);
  /* предмети */
  for(const it of G.I){
    if(it.type==='warp'){if(Math.hypot(it.x-P.x,it.y-P.y)<26&&G.mode==='play'){const d=DOORS.find(d=>d.m==='dun1'&&d.x===9+RW);fadeOut(()=>{loadMap('over',TEMPLE_DOOR.x,TEMPLE_DOOR.y+3,0);fadeIn();});}continue;}
    if(it.t>.25&&overlap({x:P.x,y:P.y-6,w:16,h:20},it)){it.taken=true;collectItem(it);}
  }
  G.I=G.I.filter(i=>!i.taken);
}
function hurtPlayerRaw(n){G.inv.hp-=n;Snd.sfx('hurt');G.shake=.2;if(G.inv.hp<=0){G.inv.hp=0;playerDie();}}
function openDoorFlood(x,y,ch){
  const st=[[x,y]];const seen=new Set();
  while(st.length){const [a,b]=st.pop();const k=a+','+b;if(seen.has(k))continue;seen.add(k);if(tileAt(a,b)!==ch)continue;setTile(a,b,'_',true);fx('ring',a*TS+16,b*TS+16,{life:.4,c:'#ffe8a0',s:18});for(const [dx,dy] of DIRS)st.push([a+dx,b+dy]);}
}
function pushBlock(b,dir){
  const [dx,dy]=DIRS[dir];const nx=b.tx+dx,ny=b.ty+dy;const ch=tileAt(nx,ny);
  if(SOLID.has(ch)||ch==='N'||ch==='Y'||hasBlockAt(nx,ny)||ch==='^')return;

function swordHit(){
  const P=G.P,sb=swordBox();
  const p=P.swing;
  if(p<.15||p>.95)return;
  for(const e of G.E){
    if(e.dead||P.hitSet.has(e))continue;
    if(overlap(sb,{x:e.x,y:e.y-(e.type==='boss'?0:6),w:e.w+4,h:e.h+8})){P.hitSet.add(e);damageEnemy(e,G.inv.dmg,P.x,P.y,200);}
  }
  /* плочки */
  const x0=Math.floor((sb.x-sb.w/2)/TS),x1=Math.floor((sb.x+sb.w/2)/TS),y0=Math.floor((sb.y-sb.h/2)/TS),y1=Math.floor((sb.y+sb.h/2)/TS);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
    const ch=tileAt(tx,ty);const key=tx+','+ty;
    if(CUTTABLE[ch]!==undefined&&!P.hitSet.has(key)){
      P.hitSet.add(key);setTile(tx,ty,CUTTABLE[ch],false);Snd.sfx('cut');
      burst(tx*TS+16,ty*TS+16,ch==='o'?9:8,ch==='o'?['#a8602e','#c97b42']:['#4e9d3f','#6dc058','#8fe070'],ch==='o'?90:70,.5);
      if(Math.random()<(ch==='o'?.55:.14))dropFrom(tx*TS+16,ty*TS+16,[[.4,'heart'],[.8,'rupee'],[.9,'rupee5'],[.95,G.inv.bombBag?'bomb':null]]);
    }else if(ch==='Y'&&!P.hitSet.has(key)){P.hitSet.add(key);hitCrystal();}
  }
}
function hitCrystal(){

  {for(let yy=0;yy<RH;yy++)for(let xx=0;xx<RW;xx++)if(tileAt(G.room.rx*RW+xx,G.room.ry*RH+yy)==='Y')burst(G.room.rx*VW+xx*TS+16,G.room.ry*VH+yy*TS+16,18,['#7affc8','#fff'],100,.7);}

function updateProjectiles(dt){
  const P=G.P;
  for(const p of G.PR){
    if(p.type==='bombE'){
      p.t+=dt;if(p.t>=p.fuse&&!p.done){p.done=true;explode(p.x,p.y);}

    if(p.type==='arrow'){
      if(ch==='Y'){hitCrystal();p.life=0;Snd.sfx('arrowhit');}
      else if(SOLID.has(ch)||tileSolid(ch,tx,ty,true)){p.life=0;Snd.sfx('arrowhit');burst(p.x,p.y,4,'#ddd',40,.3);if(ch==='t'||ch===','){}}

function explode(x,y){

  burst(x,y,26,['#ff7a1a','#ffd04a','#555','#fff'],170,.8,4);
  const R=50;
  for(const e of G.E){if(!e.dead&&Math.hypot(e.x-x,e.y-y)<R+e.w/2){if(e.type==='boss'){damageEnemy(e,3,x,y);}else damageEnemy(e,4,x,y,260);}}
  if(Math.hypot(G.P.x-x,G.P.y-y)<R)hurtPlayer(2,x,y,240);
  const x0=Math.floor((x-R)/TS),x1=Math.floor((x+R)/TS),y0=Math.floor((y-R)/TS),y1=Math.floor((y+R)/TS);

    else if(ch==='Y')hitCrystal();
  }

/* ---------- Главно обновяване ---------- */
function update(dt){
  G.time+=dt;

  if(G.fade){const f=G.fade;f.t+=dt;if(f.t>=f.dur){const cb=f.cb;if(f.dir<0)G.fade=null;else{f.t=f.dur;f.done=true;if(cb){f.cb=null;cb();}}}}
  updateFx(dt);
  switch(G.mode){
    case 'title':updateTitle(dt);break;
    case 'play':
      G.playT+=dt;
      if(INP.menuP){G.mode='menu';G.menuSel=0;G.pauseTab=0;Snd.sfx('ui');break;}
      updatePlayer(dt);updateBlocks(dt);updateEnemies(dt);updateProjectiles(dt);updateItems(dt);updateNpcs(dt);updateLock(dt);
      musicCheck();
      break;
    case 'dialog':updateDialog(dt);if(G.introWait!==undefined&&false){}break;
    case 'scroll':updateScroll(dt);updateFx(0);break;
    case 'item':updateItemGet(dt);break;
    case 'trans':break;
    case 'menu':updateMenu(dt);break;
    case 'dead':G.deadT+=dt;if(G.deadT>2.2&&(INP.aP||INP.bP||G.deadT>6)){fadeOut(()=>respawn(),.4);G.deadT=-99;}break;
    case 'end':G.endT+=dt;break;

function wrap(g,s,maxW,size){

function tileVariant(x,y){return (hash2(x,y,9)*4)|0;}

function drawRoomTiles(g,rx,ry,ox,oy,T,trees){
  const th=G.map.theme;
  for(let ly=0;ly<RH;ly++)for(let lx=0;lx<RW;lx++){
    const x=rx*RW+lx,y=ry*RH+ly;if(x<0||y<0||x>=G.map.w||y>=G.map.h)continue;
    let ch=G.tiles[y][x];let v=tileVariant(x,y),f=0,ex=null,dch=ch;
    const px=ox+lx*TS,py=oy+ly*TS;
    if(ch==='T'){dch='.';if(trees)trees.push({x:px,y:py,v:(hash2(x,y,4)<.18)?1:0,y0:y});}
    else if(ch==='~'){f=((T*3+hash2(x,y,2)*3)|0)%4;v=(x+y)%3;}
    else if(ch===','){f=((T*2+x)|0)&1;}
    else if(ch==='q'||ch==='H'||ch==='g'||ch==='W'){f=((T*7+x*3)|0)%4;if(ch==='g')f=T;if(ch==='W'){f=T;v=fl('d1_crystal')?1:0;const up=y>0?G.tiles[y-1][x]:'#';ex={lip:up!=='X'&&up!=='W'};}}
    else if(ch==='#'){const below=y+1<G.map.h?G.tiles[y+1][x]:'#';ex={face:below!=='#'&&below!=='D'&&below!=='G'};}
    else if(ch==='b'){v=fl('d1_puzzle')?1:0;}
    else if(ch==='X'){const up=y>0?G.tiles[y-1][x]:'#';ex={lip:up!=='X'&&up!=='W'};}
    else if(ch==='Y'){v=fl('d1_crystal')?1:0;}
    else if(ch==='N'){if(fl('d1_puzzle'))dch='_';}
    else if(ch==='D'||ch==='G'){}
    g.drawImage(getTile(dch,th,v,f,ex),px,py,TS,TS);
    if(G.locked&&isGap(x,y)&&ch!=='v'&&!SOLID.has(ch))g.drawImage(getTile('Z',th,0,0,null),px,py,TS,TS);
  }
}

function drawRoots(g,b){

function btnGeo(){

const ptrs=new Map();
function ptDown(e){
  Snd.init();
  if(e.pointerType==='touch'||e.pointerType==='pen')UI.touch=true;
  if(e.target&&e.target.setPointerCapture)try{e.target.setPointerCapture(e.pointerId);}catch(er){}
  const px=e.clientX,py=e.clientY;
  const hot=ptHot(px,py);
  if(hot&&(G.mode==='title'||G.mode==='menu'||G.mode==='dialog')){hot.fn();return;}
  const Gt=btnGeo();
  const inC=(b)=>Math.hypot(px-b.x,py-b.y)<=b.r*1.25;
  const mode=G.mode;
  if(mode==='title'){INP.pa=true;return;}
  if(inC(Gt.A)){ptrs.set(e.pointerId,'A');UI.btns.A=true;INP.touchA=true;INP.pa=true;return;}
  if(inC(Gt.B)){ptrs.set(e.pointerId,'B');UI.btns.B=true;INP.touchB=true;INP.pb=true;return;}
  if(G.inv&&G.inv.bombBag&&G.inv.bow&&inC(Gt.S)){ptrs.set(e.pointerId,'S');UI.btns.S=true;INP.ps=true;return;}
  if(inC(Gt.M)){ptrs.set(e.pointerId,'M');UI.btns.M=true;INP.pm=true;return;}
  if(mode==='dialog'||mode==='dead'||mode==='item'){INP.pa=true;return;}
  if(px<V.sw*.5){ptrs.set(e.pointerId,'J');UI.joy={id:e.pointerId,ox:px,oy:py,kx:px,ky:py};INP.touchMove={x:0,y:0};}

  if(d>maxR){j.ox+=dx/d*(d-maxR);j.oy+=dy/d*(d-maxR);dx=e.clientX-j.ox;dy=e.clientY-j.oy;}
  const dd=Math.hypot(dx,dy);j.kx=j.ox+dx;j.ky=j.oy+dy;
  const k=dd/maxR;
  INP.touchMove=k<.18?{x:0,y:0}:{x:dx/dd*Math.min(1,k*1.25),y:dy/dd*Math.min(1,k*1.25)};
}
function ptUp(e){
  const t=ptrs.get(e.pointerId);ptrs.delete(e.pointerId);
  if(t==='J'){UI.joy=null;INP.touchMove=null;}
  else if(t==='A'){UI.btns.A=false;INP.touchA=false;}else if(t==='B'){UI.btns.B=false;INP.touchB=false;}else if(t==='S'){UI.btns.S=false;}else if(t==='M'){UI.btns.M=false;}
}
function bindEvents(){
  CV.addEventListener('pointerdown',e=>{e.preventDefault();ptDown(e);},{passive:false});
  CV.addEventListener('pointermove',e=>{e.preventDefault();ptMove(e);},{passive:false});
  CV.addEventListener('pointerup',e=>{e.preventDefault();ptUp(e);},{passive:false});
  CV.addEventListener('pointercancel',ptUp);
  CV.addEventListener('contextmenu',e=>e.preventDefault());
  window.addEventListener('keydown',e=>{Snd.init();INP.keys[e.code]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Tab'].includes(e.code))e.preventDefault();
    if(e.code==='KeyF'&&!e.repeat){try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen();}catch(er){}}});
  window.addEventListener('keyup',e=>{INP.keys[e.code]=false;});
  window.addEventListener('blur',()=>{INP.keys={};});
  window.addEventListener('resize',layout);
  window.addEventListener('orientationchange',()=>setTimeout(layout,200));
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.mode==='play'){save(true);G.mode='menu';G.menuSel=0;}});
  try{if(window.matchMedia&&matchMedia('(pointer:coarse)').matches)UI.touch=true;}catch(e){}
}
/* ---------- Рисуване на кадър ---------- */
function render(){
  const T=G.time;
  cx.setTransform(1,0,0,1,0,0);cx.fillStyle='#07060d';cx.fillRect(0,0,CV.width,CV.height);
  cx.setTransform(V.dpr*V.s,0,0,V.dpr*V.s,V.dpr*V.ox,V.dpr*V.oy);
  cx.save();cx.beginPath();cx.rect(0,0,VW,VH);cx.clip();
  UI.hot.length=(G.mode==='title'||G.mode==='menu')?0:UI.hot.length;
  if(G.map){
    drawWorld(cx,T);
    if(G.mode!=='title')drawLight(cx,T);
  }
  if(G.mode==='title')drawTitle(cx,T);
  else{
    if(G.mode!=='menu'||true){drawHUD(cx,T);}
    if(G.mode==='item')drawItemGet(cx,T);
    UI.hot.length=0;
    if(G.mode==='dialog'||G.dialog)drawDialog(cx,T);
    if(G.mode==='menu')drawMenu(cx,T);
    if(G.mode==='dead')drawDead(cx,T);
    if(G.msg&&G.mode!=='menu'){txt(cx,G.msg.t,VW/2,VH-30,13,'#9fe8ff','center','800');G.msg.time-=1/60;if(G.msg.time<=0)G.msg=null;}
  }
  if(G.fade){const f=G.fade;let a=f.t/f.dur;if(f.dir<0)a=1-a;cx.fillStyle='rgba(0,0,0,'+clamp(a,0,1)+')';cx.fillRect(0,0,VW,VH);}
  cx.restore();
  /* докосване в екранни координати */
  cx.setTransform(V.dpr,0,0,V.dpr,0,0);
  drawTouch(cx);
}
let _last=0;
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(.033,Math.max(0,(ts-_last)/1000));_last=ts;
  INP.poll();
  try{update(dt);}catch(e){console.error(e);}
  try{render();}catch(e){console.error(e);}
}
function boot(){
  layout();bindEvents();
  G.inv=newInv();
  const saved0=opts_noSpawn;opts_noSpawn=true;
  buildMaps();
  G.P=newPlayer();
  loadMap('over',VIL.x+19,VIL.y+7,0);
  opts_noSpawn=false;
  G.mode='title';G.P=null;
  if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
  requestAnimationFrame(frame);
}

boot();
</script>
