<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#070b14">
<title>Spark — запознанства</title>
<style>
/* ═════════ Spark — тъмна тема със светлосин текст ═════════ */
:root {
  color-scheme: dark;
  /* Тези стойности се презаписват от персонализацията (js/app.js) */
  --bg: #070b14;
  --surface: #0f1626;
  --text: #bfe3ff;
  --heading: #ffffff;
  --accent: #5cc8ff;
  --border: #24477a;
  --radius: 16px;
  --bw: 1px;
  --glow: 0.4;
  --font-scale: 1;

  --muted: color-mix(in srgb, var(--text) 62%, transparent);
  --faint: color-mix(in srgb, var(--text) 14%, transparent);
  --surface-2: color-mix(in srgb, var(--surface) 80%, white 6%);
  --glow-shadow: 0 0 calc(28px * var(--glow)) color-mix(in srgb, var(--accent) calc(var(--glow) * 45%), transparent);
  --danger: #ff7a90;
  --alert: #ffb347;
  --ok: #6ee7b7;
  --ease: cubic-bezier(.2, .8, .2, 1);
}

* { box-sizing: border-box; }
html { font-size: calc(16px * var(--font-scale)); scroll-behavior: smooth; }
body {
  margin: 0; min-height: 100vh; display: flex; flex-direction: column;
  background: var(--bg); color: var(--text);
  font-family: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif;
  line-height: 1.55; overflow-x: hidden;
}
h1, h2, h3, h4 { color: var(--heading); line-height: 1.2; margin: 0 0 .5em; letter-spacing: .01em; }
h1 { font-size: clamp(2rem, 5vw, 3.2rem); }
h2 { font-size: 1.6rem; } h3 { font-size: 1.15rem; }
p { margin: 0 0 1em; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.dim { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
main:focus, main:focus-visible { outline: none; }
main { flex: 1; width: 100%; max-width: 1240px; margin: 0 auto; padding: 1.5rem 1rem 3rem; outline: none; }

/* ── Фон ── */
.bg-orbs { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.bg-orbs i { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .28; background: var(--accent); animation: drift 24s ease-in-out infinite alternate; }
.bg-orbs i:nth-child(1) { width: 46vmax; height: 46vmax; left: -12vmax; top: -14vmax; }
.bg-orbs i:nth-child(2) { width: 38vmax; height: 38vmax; right: -10vmax; top: 20vh; background: color-mix(in srgb, var(--accent) 55%, #6a5cff); animation-duration: 30s; }
.bg-orbs i:nth-child(3) { width: 30vmax; height: 30vmax; left: 30vw; bottom: -16vmax; background: color-mix(in srgb, var(--accent) 60%, white); opacity: .16; animation-duration: 36s; }
@keyframes drift { to { transform: translate(6vw, 5vh) scale(1.15); } }

/* ── Горна лента ── */
.topbar {
  position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 1rem;
  padding: .65rem 1rem; flex-wrap: wrap;
  background: color-mix(in srgb, var(--bg) 78%, transparent);
  backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4);
  border-bottom: var(--bw) solid var(--border);
}
.brand { display: flex; align-items: center; gap: .5rem; color: var(--heading); font-weight: 800; font-size: 1.35rem; letter-spacing: .03em; }
.brand svg { color: var(--accent); filter: drop-shadow(0 0 8px color-mix(in srgb, var(--accent) 70%, transparent)); transition: transform .5s var(--ease); }
.brand:hover { text-decoration: none; } .brand:hover svg { transform: rotate(-12deg) scale(1.15); }
.nav { display: flex; gap: .25rem; flex: 1; flex-wrap: wrap; }
.nav a { padding: .45rem .9rem; border-radius: 999px; color: var(--text); font-weight: 600; transition: background .25s, color .25s; }
.nav a:hover { background: var(--faint); text-decoration: none; }
.nav a.on { background: color-mix(in srgb, var(--accent) 20%, transparent); color: var(--heading); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 55%, transparent); }
.tools { display: flex; align-items: center; gap: .5rem .75rem; margin-left: auto; flex-wrap: wrap; justify-content: flex-end; min-width: 0; max-width: 100%; }
.fontctl { display: flex; gap: 2px; }
.chip-btn { font: inherit; font-weight: 700; color: var(--text); background: var(--faint); border: var(--bw) solid var(--border); padding: .25rem .6rem; cursor: pointer; transition: background .2s, transform .15s; }
.fontctl .chip-btn:first-child { border-radius: 10px 0 0 10px; } .fontctl .chip-btn:last-child { border-radius: 0 10px 10px 0; }
.chip-btn:hover { background: color-mix(in srgb, var(--accent) 25%, transparent); } .chip-btn:active { transform: scale(.94); }
.userbox { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; min-width: 0; }
.userbox .who { font-weight: 700; color: var(--heading); max-width: 14ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

@media (max-width: 640px) {
  .topbar { gap: .5rem; }
  .tools { width: 100%; margin-left: 0; justify-content: space-between; }
  .nav { order: 3; width: 100%; }
  .nav a { padding: .4rem .7rem; }
}

/* ── „Прозорци“ (карти) ── */
.win {
  position: relative; background: color-mix(in srgb, var(--surface) 88%, transparent);
  border: var(--bw) solid var(--border); border-radius: var(--radius);
  box-shadow: var(--glow-shadow), 0 12px 40px rgba(0, 0, 0, .35);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.win > .win-head {
  display: flex; align-items: center; gap: .6rem; padding: .7rem 1rem; border-bottom: var(--bw) solid var(--border);
  border-radius: var(--radius) var(--radius) 0 0; background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 10%, transparent), transparent);
}
.win-head h2, .win-head h3 { margin: 0; font-size: 1.05rem; }
.dots { display: inline-flex; gap: 6px; } .dots b { width: 10px; height: 10px; border-radius: 50%; background: var(--faint); box-shadow: inset 0 0 0 1px var(--border); }
.dots b:first-child { background: color-mix(in srgb, var(--accent) 80%, transparent); }
.win-body { padding: 1.1rem 1.2rem; }
.enter { animation: fadeUp .6s var(--ease) both; animation-delay: calc(var(--i, 0) * 55ms); }
@keyframes fadeUp { from { opacity: 0; transform: translateY(16px) scale(.98); } to { opacity: 1; transform: none; } }

/* ── Форми и бутони ── */
label { display: block; font-weight: 600; margin-bottom: .3rem; color: var(--heading); font-size: .92rem; }
input, select, textarea {
  width: 100%; font: inherit; color: var(--heading); background: color-mix(in srgb, var(--bg) 70%, var(--surface));
  border: var(--bw) solid var(--border); border-radius: calc(var(--radius) * .6); padding: .6rem .8rem;
  transition: border-color .2s, box-shadow .2s;
}
input::placeholder, textarea::placeholder { color: var(--muted); }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 28%, transparent); }
select option { background: var(--surface); color: var(--heading); }
textarea { resize: vertical; min-height: 7rem; }
input[type=checkbox], input[type=radio] { width: auto; accent-color: var(--accent); }
input[type=range] { padding: 0; accent-color: var(--accent); }
input[type=color] { padding: 2px; height: 2.4rem; width: 3.4rem; cursor: pointer; }
.field { margin-bottom: 1rem; } .row { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.hint { font-size: .82rem; color: var(--muted); margin-top: .25rem; }
.err { color: var(--danger); font-weight: 600; margin: .5rem 0; min-height: 1.2em; }

.btn {
  font: inherit; font-weight: 700; cursor: pointer; color: #04101c; border: 0; border-radius: 999px;
  padding: .65rem 1.4rem; background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 55%, white));
  box-shadow: var(--glow-shadow); transition: transform .2s var(--ease), box-shadow .2s, filter .2s; position: relative; overflow: hidden;
}
.btn:hover { text-decoration: none; transform: translateY(-2px); filter: brightness(1.08); } .btn:active { transform: translateY(0) scale(.97); }
.btn[disabled] { opacity: .55; cursor: not-allowed; transform: none; }
.btn.ghost { color: var(--heading); background: transparent; border: var(--bw) solid var(--border); box-shadow: none; }
.btn.ghost:hover { background: var(--faint); }
.btn.danger { background: transparent; color: var(--danger); border: var(--bw) solid color-mix(in srgb, var(--danger) 60%, transparent); box-shadow: none; }
.btn.sm { padding: .35rem .9rem; font-size: .88rem; }
.btn.block { width: 100%; }

.tabs { display: flex; gap: .25rem; padding: .3rem; background: var(--faint); border-radius: 999px; margin-bottom: 1.1rem; }
.tabs button { flex: 1; font: inherit; font-weight: 700; color: var(--text); background: transparent; border: 0; border-radius: 999px; padding: .5rem; cursor: pointer; transition: background .25s, color .25s; }
.tabs button[aria-selected=true] { background: color-mix(in srgb, var(--accent) 24%, transparent); color: var(--heading); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 55%, transparent); }

.chips { display: flex; flex-wrap: wrap; gap: .45rem; }
.chip { font: inherit; font-size: .88rem; cursor: pointer; color: var(--text); background: transparent; border: var(--bw) solid var(--border); border-radius: 999px; padding: .28rem .8rem; transition: all .2s var(--ease); }
.chip:hover { border-color: var(--accent); transform: translateY(-1px); }
.chip[aria-pressed=true] { background: color-mix(in srgb, var(--accent) 24%, transparent); border-color: var(--accent); color: var(--heading); }
.tag { display: inline-block; font-size: .78rem; padding: .12rem .6rem; border-radius: 999px; border: var(--bw) solid var(--border); background: var(--faint); }
.tag.demo { border-style: dashed; color: var(--muted); }

/* ── Начална страница ── */
.hero { display: grid; gap: 2rem; grid-template-columns: 1.15fr .85fr; align-items: center; padding: 1rem 0 2rem; }
.hero h1 span { color: var(--accent); text-shadow: 0 0 calc(30px * var(--glow)) var(--accent); }
.hero .lead { font-size: 1.15rem; max-width: 36rem; }
.stats { display: flex; gap: 1.5rem; flex-wrap: wrap; margin: 1.5rem 0; }
.stat b { display: block; font-size: 1.8rem; color: var(--heading); } .stat span { color: var(--muted); font-size: .9rem; }
.feat { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); margin-top: 1rem; }
.feat .win-body h3 { display: flex; align-items: center; gap: .5rem; }
.feat .ico { font-size: 1.4rem; }
.cityline { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: 1rem; }
@media (max-width: 860px) { .hero { grid-template-columns: 1fr; } }

/* ── Открий ── */
.layout { display: grid; grid-template-columns: 300px 1fr; gap: 1.2rem; align-items: start; }
.sidebar { position: sticky; top: 5.2rem; max-height: calc(100vh - 6.5rem); overflow: auto; }
.cities { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .5rem; }
.city { text-align: left; font: inherit; cursor: pointer; color: var(--text); background: transparent; border: var(--bw) solid var(--border); border-radius: calc(var(--radius) * .7); padding: .5rem .7rem; display: flex; justify-content: space-between; gap: .4rem; transition: all .22s var(--ease); }
.city:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: var(--glow-shadow); }
.city[aria-pressed=true] { background: color-mix(in srgb, var(--accent) 22%, transparent); border-color: var(--accent); color: var(--heading); }
.city small { color: var(--muted); font-weight: 700; } .city.empty { opacity: .55; }
.citybar { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; margin-bottom: 1rem; }
.citybar h2 { margin: 0; flex: 1; min-width: 12rem; }
.grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.card { overflow: hidden; padding: 0; text-align: left; font: inherit; color: inherit; display: flex; flex-direction: column; transition: transform .3s var(--ease), box-shadow .3s, border-color .3s; }
.card:hover, .card:focus-within { transform: translateY(-6px) scale(1.01); border-color: var(--accent); box-shadow: 0 0 calc(40px * var(--glow) + 8px) color-mix(in srgb, var(--accent) 50%, transparent), 0 16px 40px rgba(0,0,0,.45); }
.cardmain { all: unset; box-sizing: border-box; display: block; width: 100%; cursor: pointer; flex: 1; color: inherit; font: inherit; text-align: left; }
.cardmain:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: var(--radius); }
.cardact { display: flex; align-items: center; gap: .6rem; padding: 0 .9rem .9rem; }
.card .ph { aspect-ratio: 4 / 5; background: var(--faint); position: relative; overflow: hidden; border-radius: calc(var(--radius) - var(--bw)) calc(var(--radius) - var(--bw)) 0 0; }
.card .ph img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .6s var(--ease); }
.card:hover .ph img { transform: scale(1.07); }
.card .ph::after { content: ''; position: absolute; inset: 55% 0 0; background: linear-gradient(transparent, rgba(0,0,0,.72)); }
.card .over { position: absolute; left: .8rem; right: .8rem; bottom: .6rem; z-index: 1; color: #fff; }
.card .over b { font-size: 1.15rem; display: block; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
.card .meta { padding: .7rem .9rem .9rem; font-size: .9rem; }
.card .meta p { margin: 0 0 .5rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--muted); }
.dot { display: inline-block; width: .55rem; height: .55rem; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); margin-right: .3rem; animation: pulse 2s infinite; }
@keyframes pulse { 50% { opacity: .45; } }
.badge-tr { position: absolute; top: .6rem; right: .6rem; z-index: 2; }
.empty-state { text-align: center; padding: 3rem 1rem; color: var(--muted); }
.empty-state .big { font-size: 3rem; }
.fgroup { margin-bottom: 1rem; } .fgroup > label { margin-bottom: .45rem; }
.agepair { display: flex; align-items: center; gap: .5rem; } .agepair input { text-align: center; }
.checkline { display: flex; gap: .5rem; align-items: center; margin: .35rem 0; font-weight: 500; }
.checkline label { margin: 0; font-weight: 500; color: var(--text); }
.filterbar { margin-bottom: .8rem; } .filter-toggle .badge { margin-left: .4rem; }
.sidebar.closed { display: none; }
/* Без панел с филтри резултатите заемат цялата ширина и се събират повече карти. */
.layout.nofilters { grid-template-columns: 1fr; }
.layout.nofilters .grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; } .sidebar { position: static; max-height: none; }
}

/* ── Модален прозорец ── */
.overlay { position: fixed; inset: 0; z-index: 100; background: rgba(2, 5, 12, .72); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; padding: 1rem; animation: fade .25s both; }
@keyframes fade { from { opacity: 0; } }
.modal { width: min(900px, 100%); max-height: calc(100vh - 2rem); overflow: auto; animation: pop .4s var(--ease) both; }
.modal.narrow { width: min(460px, 100%); }
@keyframes pop { from { opacity: 0; transform: translateY(24px) scale(.94); } }
.xbtn { margin-left: auto; font: inherit; font-size: 1.2rem; line-height: 1; cursor: pointer; color: var(--text); background: transparent; border: 0; border-radius: 8px; padding: .2rem .55rem; }
.xbtn:hover { background: var(--faint); color: var(--heading); }
.pview { display: grid; grid-template-columns: 1.05fr 1fr; gap: 1.3rem; }
.gallery .main { position: relative; display: block; width: 100%; padding: 0; cursor: zoom-in; aspect-ratio: 4 / 5; border-radius: calc(var(--radius) * .7); overflow: hidden; background: var(--faint); border: var(--bw) solid var(--border); }
.gallery .main img { width: 100%; height: 100%; object-fit: cover; display: block; animation: fade .4s both; }
.thumbs { display: flex; gap: .4rem; margin-top: .5rem; flex-wrap: wrap; }
.thumbs button { width: 56px; height: 56px; padding: 0; border-radius: 10px; overflow: hidden; border: 2px solid transparent; cursor: pointer; background: var(--faint); transition: border-color .2s, transform .2s; }
.thumbs button:hover { transform: translateY(-2px); } .thumbs button[aria-current=true] { border-color: var(--accent); }
.thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: .3rem 1rem; margin: 0 0 1rem; } .facts dt { color: var(--muted); } .facts dd { margin: 0; color: var(--heading); font-weight: 600; }
.bio { white-space: pre-wrap; overflow-wrap: anywhere; }
.actions { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: 1rem; }
@media (max-width: 720px) { .pview { grid-template-columns: 1fr; } }

/* ── Профил / снимки ── */
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: .7rem; }
.ph-item { position: relative; aspect-ratio: 4 / 5; border-radius: calc(var(--radius) * .6); overflow: hidden; border: var(--bw) solid var(--border); background: var(--faint); animation: pop .4s var(--ease) both; }
.ph-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph-item .ctl { position: absolute; inset: auto 0 0 0; display: flex; gap: 4px; padding: 6px; background: linear-gradient(transparent, rgba(0,0,0,.8)); opacity: 0; transition: opacity .2s; }
.ph-item:hover .ctl, .ph-item:focus-within .ctl { opacity: 1; }
@media (hover: none) { .ph-item .ctl { opacity: 1; } }
.ph-item .ctl button { flex: 1; font: inherit; font-size: .75rem; padding: .25rem; border-radius: 8px; border: 0; cursor: pointer; background: rgba(255,255,255,.16); color: #fff; }
.ph-item .ctl button:hover { background: var(--accent); color: #04101c; }
.ph-item .main-tag { position: absolute; top: 6px; left: 6px; font-size: .7rem; padding: .1rem .5rem; border-radius: 999px; background: var(--accent); color: #04101c; font-weight: 800; }
.dropzone { display: grid; place-items: center; text-align: center; aspect-ratio: 4 / 5; border: 2px dashed var(--border); border-radius: calc(var(--radius) * .6); cursor: pointer; color: var(--muted); transition: border-color .2s, background .2s, transform .2s; font: inherit; background: transparent; }
.dropzone:hover, .dropzone.over { border-color: var(--accent); background: var(--faint); transform: scale(1.02); color: var(--heading); }
.two { display: grid; gap: 1.2rem; grid-template-columns: 1fr 1fr; align-items: start; } @media (max-width: 900px) { .two { grid-template-columns: 1fr; } }
.stack > * + * { margin-top: 1.2rem; }
.counter { text-align: right; font-size: .8rem; color: var(--muted); }

/* ── Настройки на темата ── */
.swatches { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: .8rem 1.2rem; }
.swatch { display: flex; align-items: center; gap: .7rem; } .swatch label { margin: 0; flex: 1; } .swatch code { font-size: .8rem; color: var(--muted); }
.presets { display: flex; flex-wrap: wrap; gap: .6rem; }
.preset { font: inherit; cursor: pointer; border-radius: 12px; padding: .5rem .9rem; border: var(--bw) solid var(--border); background: var(--faint); color: var(--heading); display: flex; gap: .5rem; align-items: center; transition: transform .2s, border-color .2s; }
.preset:hover { transform: translateY(-2px); border-color: var(--accent); }
.preset i { width: 1rem; height: 1rem; border-radius: 50%; display: inline-block; }
.slider { margin-bottom: 1rem; } .slider output { float: right; color: var(--accent); font-weight: 700; }
.live { padding: 1rem; border-radius: var(--radius); border: var(--bw) solid var(--border); background: var(--surface); box-shadow: var(--glow-shadow); }

/* ── Админ ── */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: .8rem; }
.tile { padding: .9rem 1rem; border: var(--bw) solid var(--border); border-radius: calc(var(--radius) * .7); background: var(--faint); }
.tile b { display: block; font-size: 1.7rem; color: var(--heading); font-variant-numeric: tabular-nums; } .tile span { color: var(--muted); font-size: .88rem; }
.bars { display: grid; gap: .5rem; }
.bar { display: grid; grid-template-columns: 8.5rem 1fr 2rem; gap: .6rem; align-items: center; font-size: .92rem; } .bar b { text-align: right; color: var(--heading); font-variant-numeric: tabular-nums; }
.bar .track { height: .65rem; border-radius: 999px; background: var(--faint); overflow: hidden; }
.bar .track i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 50%, white)); box-shadow: var(--glow-shadow); animation: grow .8s var(--ease) both; transform-origin: left; }
@keyframes grow { from { transform: scaleX(0); } }
.tblwrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; min-width: 640px; font-size: .92rem; }
.tbl th { text-align: left; color: var(--muted); font-weight: 600; padding: .45rem .6rem; border-bottom: var(--bw) solid var(--border); white-space: nowrap; }
.tbl td { padding: .45rem .6rem; border-bottom: 1px solid var(--faint); vertical-align: middle; }
.tbl tbody tr:hover { background: var(--faint); }
@media (max-width: 520px) { .bar { grid-template-columns: 6.5rem 1fr 1.6rem; } }

/* ── Съобщения ── */

@media (max-width: 800px) {
  .chatlayout { grid-template-columns: 1fr; height: calc(100vh - 14rem); }

  .backbtn { display: inline-block; margin-left: 0; }
}
/* ── Плаващо кръгче със съобщения ── */

  box-shadow: 0 0 24px 2px var(--alert), 0 8px 24px rgba(0,0,0,.5); animation: dockpulse 1.8s ease-out infinite, dockshake 5s ease-in-out infinite; }

  70% { box-shadow: 0 0 0 20px transparent, 0 0 34px 4px var(--alert), 0 8px 24px rgba(0,0,0,.5); } 100% { box-shadow: 0 0 0 0 transparent, 0 0 18px var(--alert), 0 8px 24px rgba(0,0,0,.5); } }
@keyframes dockshake { 0%, 86%, 100% { transform: none; } 89% { transform: rotate(-14deg); } 92% { transform: rotate(12deg); } 95% { transform: rotate(-7deg); } 98% { transform: rotate(4deg); } }
.dockpanel { width: min(370px, calc(100vw - 2rem)); height: min(500px, calc(100vh - 7.5rem)); display: flex; flex-direction: column; overflow: hidden; transform-origin: bottom right; animation: dockin .3s var(--ease) both; }

.dockpanel .win-head { gap: .4rem; } .dockpanel .win-head h2 { margin: 0; font-size: 1rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .dockpanel .win-head h2 a { color: var(--heading); }

.dockpanel .composer textarea { min-height: 0; }

/* ── Чат панел, емотиконки, файлове, групи ── */
.chatpane { display: flex; flex-direction: column; min-height: 0; height: 100%; position: relative; }

.chatpane .win-head { flex: none; display: flex; align-items: center; gap: .5rem; flex-wrap: nowrap; padding: .6rem .8rem; border-bottom: var(--bw) solid var(--border); border-radius: var(--radius) var(--radius) 0 0; background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 10%, transparent), transparent); } .chatpane .win-head h2 { margin: 0; font-size: 1rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .chatpane .win-head h2 a { color: var(--heading); }

  background: linear-gradient(135deg, hsl(var(--gh) 75% 48%), hsl(calc(var(--gh) + 50) 70% 30%)); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--accent) 55%, transparent); }

.bubble.emobig .txt { font-size: 2.3rem; line-height: 1.1; } .bubble.emobig .emo { height: 2.6rem; width: 2.6rem; vertical-align: -.5rem; }
.bubble.emobig { background: transparent; box-shadow: none; padding: .1rem .3rem; } .bubble.emobig time { color: var(--muted); }
.bubble .att-img { all: unset; display: block; cursor: zoom-in; border-radius: 12px; overflow: hidden; max-width: 240px; } .bubble .att-img img { display: block; max-width: 100%; max-height: 280px; object-fit: cover; border-radius: 12px; }
.att-file { display: flex; align-items: center; gap: .6rem; padding: .45rem .6rem; border-radius: 12px; background: color-mix(in srgb, var(--bg) 55%, transparent); border: var(--bw) solid var(--border); color: var(--heading); min-width: 0; }
.att-file:hover { text-decoration: none; border-color: var(--accent); } .ficon { font-size: 1.6rem; flex: none; } .finfo { display: grid; min-width: 0; } .finfo b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; max-width: 190px; } .finfo small { color: var(--muted); } .fdl { margin-left: auto; opacity: .8; }
.pendingatt { display: flex; align-items: center; gap: .6rem; margin: 0 .7rem; padding: .4rem .6rem; border: var(--bw) dashed var(--accent); border-radius: 12px; background: var(--faint); } .pendingatt[hidden] { display: none; }
.pendingatt img { width: 42px; height: 42px; object-fit: cover; border-radius: 8px; } .pendingatt .xbtn { margin-left: auto; }
.composer .xbtn { font-size: 1.25rem; padding: .3rem .45rem; flex: none; } .emo-btn { width: 1.7rem; height: 1.7rem; display: block; }
.chatpane .composer { flex: none; flex-wrap: wrap; position: relative; } .chatpane .notice { font-size: .74rem; padding: .3rem .8rem; margin: 0; border-radius: 0; background: transparent; color: var(--muted); border-top: 1px solid var(--faint); } .chatpane .composer textarea { flex: 1 1 8rem; }
.emopop { position: absolute; z-index: 20; left: .5rem; right: .5rem; bottom: calc(100% + 6px); max-width: 380px; max-height: 330px; overflow: auto; background: var(--surface); border: var(--bw) solid var(--accent); border-radius: var(--radius); box-shadow: var(--glow-shadow), 0 14px 34px rgba(0,0,0,.55); animation: pop .2s var(--ease) both; }
.emogrid { display: flex; flex-wrap: wrap; gap: .15rem; padding: .3rem .5rem .6rem; } .emogrp { flex-basis: 100%; font-size: .74rem; color: var(--muted); margin: .4rem 0 .1rem; }
.emobtn { all: unset; cursor: pointer; padding: .2rem; border-radius: 8px; line-height: 0; transition: transform .12s, background .12s; } .emobtn:hover, .emobtn:focus-visible { background: color-mix(in srgb, var(--accent) 22%, transparent); transform: scale(1.18); }
.emobtn.uni { font-size: 1.45rem; line-height: 1.2; padding: .1rem .2rem; }
.contacts { display: grid; gap: .25rem; max-height: 240px; overflow-y: auto; padding: .2rem; border: var(--bw) solid var(--border); border-radius: calc(var(--radius) * .6); }
.contact { display: flex; align-items: center; gap: .6rem; padding: .35rem .5rem; border-radius: 10px; cursor: pointer; margin: 0; font-weight: 500; } .contact:hover { background: var(--faint); }
.contact img { border-radius: 50%; object-fit: cover; flex: none; } .contact .ci { display: grid; min-width: 0; flex: 1; } .contact .ci b { color: var(--heading); }
.lightbox { text-align: center; } .lightbox img { max-width: 100%; max-height: 68vh; border-radius: 12px; }
.chatthread { padding: 0; } .dockpanel .chatpane { flex: 1; }

/* ── Имейл потвърждение, банери, попълненост, активност ── */
.hp { position: absolute !important; left: -9999px; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.ok { color: var(--ok); font-weight: 600; margin: .4rem 0; min-height: 1.2em; }

.wrongmail { margin-top: 1rem; } .wrongmail summary { cursor: pointer; color: var(--accent); } .changemail { display: grid; gap: .6rem; margin-top: .6rem; }
.banners { display: grid; gap: .5rem; padding: 0 1rem; max-width: 1240px; margin: .6rem auto 0; width: 100%; } .banners:empty { display: none; }
.banner { display: flex; align-items: center; flex-wrap: wrap; gap: .6rem 1rem; padding: .7rem 1rem; border-radius: var(--radius); border: var(--bw) solid var(--border); background: var(--surface); animation: fadeUp .4s var(--ease) both; }
.banner .bico { font-size: 1.5rem; } .banner .btxt { display: grid; gap: .15rem; flex: 1 1 18rem; min-width: 0; } .banner .btxt b { color: var(--heading); }

.banner.info { border-color: var(--accent); }
.meter { height: .7rem; border-radius: 999px; background: var(--faint); overflow: hidden; margin-top: .5rem; } .meter i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 50%, white)); box-shadow: var(--glow-shadow); animation: grow .8s var(--ease) both; transform-origin: left; }
.completeness { margin-bottom: 1.2rem; } .cmeta { display: flex; flex-wrap: wrap; gap: .3rem 1rem; align-items: baseline; justify-content: space-between; }
.nudge { display: flex; flex-wrap: wrap; gap: .6rem 1rem; align-items: center; justify-content: space-between; padding: .6rem 1rem; margin-bottom: 1rem; border-radius: var(--radius); border: var(--bw) dashed var(--accent); background: var(--faint); }
.tag.goal { border-color: var(--accent); color: var(--heading); } .card .meta .extra { color: var(--accent); font-size: .82rem; font-weight: 600; -webkit-line-clamp: 1; }

/* ── Досиета ── */
.timeline { display: grid; gap: .6rem; }
.tl { padding: .65rem .8rem; border: var(--bw) solid var(--border); border-radius: calc(var(--radius) * .6); background: var(--faint); }

.tl .bio { margin: .2rem 0; } .appeal { margin-top: .5rem; padding: .6rem .8rem; border-radius: 10px; border: 1px dashed var(--alert); } .appeal input { margin: .4rem 0; }

/* ── Обаждания ── */
.callui { position: fixed; inset: 0; z-index: 150; display: grid; place-items: center; padding: 1rem; background: rgba(2, 5, 12, .82); backdrop-filter: blur(8px); animation: fade .25s both; }
.callwin { width: min(760px, 100%); max-height: 100%; display: grid; gap: 1rem; justify-items: center; padding: 1.2rem; border-radius: calc(var(--radius) * 1.4); border: var(--bw) solid var(--accent); background: color-mix(in srgb, var(--surface) 94%, transparent); box-shadow: var(--glow-shadow), 0 20px 60px rgba(0,0,0,.6); animation: pop .35s var(--ease) both; }
.cstage { position: relative; width: 100%; aspect-ratio: 16 / 10; max-height: 56vh; border-radius: var(--radius); overflow: hidden; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--accent) 24%, var(--bg)), var(--bg)); }
.cstage:not(.video) { aspect-ratio: auto; height: 190px; background: transparent; }
.cremote { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; opacity: 0; } .cstage.video.live .cremote { opacity: 1; } .cstage:not(.video) .cremote { display: none; }
.cstage.live .cavatar { opacity: 0; pointer-events: none; } .cstage:not(.video).live .cavatar { opacity: 1; }
.cavatar { position: relative; z-index: 1; transition: opacity .4s; } .cavatar img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent); box-shadow: var(--glow-shadow); position: relative; z-index: 1; }
.cavatar::before, .cavatar::after { content: ''; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--accent); animation: ringout 2.2s ease-out infinite; opacity: 0; } .cavatar::after { animation-delay: 1.1s; }
.cstage.live .cavatar::before, .cstage.live .cavatar::after { animation-duration: 3.4s; }
@keyframes ringout { from { transform: scale(1); opacity: .7; } to { transform: scale(1.9); opacity: 0; } }
.clocal { position: absolute; right: .7rem; bottom: .7rem; width: 28%; max-width: 170px; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 12px; border: 2px solid var(--accent); background: #000; z-index: 3; transform: scaleX(-1); } .clocal[hidden] { display: none; }
.cinfo { text-align: center; } .cname { margin: 0; font-size: 1.5rem; } .cstatus { color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; min-height: 1.5em; }
.cdemo { margin: .4rem 0 0; font-size: .82rem; color: var(--muted); } .cdemo[hidden] { display: none; } .chint { margin: 0; font-size: .76rem; color: var(--muted); text-align: center; }
.cctl { display: flex; gap: 1.2rem; justify-content: center; flex-wrap: wrap; }
.cbtn { all: unset; cursor: pointer; display: grid; justify-items: center; gap: .3rem; color: var(--text); font-size: .74rem; } .cbtn span { display: grid; place-items: center; width: 3.6rem; height: 3.6rem; border-radius: 50%; font-size: 1.5rem; background: var(--faint); border: var(--bw) solid var(--border); transition: transform .15s, background .2s; }
.cbtn:hover span { transform: scale(1.08); } .cbtn:focus-visible span { outline: 2px solid var(--accent); outline-offset: 2px; } .cbtn[aria-pressed=true] span { background: color-mix(in srgb, var(--alert) 40%, var(--surface)); border-color: var(--alert); }
.cbtn.good span { background: #1e9e62; border-color: #1e9e62; color: #fff; box-shadow: 0 0 22px #1e9e62; animation: pulse 1.4s infinite; } .cbtn.bad span { background: #d6304f; border-color: #d6304f; color: #fff; }
.cbtn.bad span:has(+ small) { } .callbtn { font-size: 1.15rem; }
body.in-call { overflow: hidden; }

/* ── Доклади ── */
.replist { display: grid; gap: .6rem; }
.rep { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .9rem; padding: .65rem .8rem; border: var(--bw) solid var(--border); border-radius: calc(var(--radius) * .6); background: var(--faint); }
.rep .who { flex: 1 1 14rem; min-width: 0; overflow-wrap: anywhere; }
.tag.st-open { border-color: var(--accent); color: var(--heading); } .tag.st-upheld { border-color: var(--danger); color: var(--danger); } .tag.st-dismissed { border-color: var(--ok); color: var(--ok); }

/* ── Избор на област и населено място ── */
.placepick .row { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: .7rem; margin-bottom: 0; }
.lbl { display: block; font-weight: 600; margin-bottom: .3rem; color: var(--heading); font-size: .92rem; }
.combo { position: relative; }
.combo-list { position: absolute; z-index: 40; left: 0; right: 0; top: calc(100% + 4px); margin: 0; padding: .3rem; list-style: none; max-height: 16rem; overflow-y: auto;
  background: var(--surface); border: var(--bw) solid var(--accent); border-radius: calc(var(--radius) * .6); box-shadow: var(--glow-shadow), 0 14px 34px rgba(0,0,0,.55); }
.combo-list[hidden] { display: none; }
.combo-list li { display: flex; justify-content: space-between; align-items: baseline; gap: .6rem; padding: .45rem .6rem; border-radius: 8px; cursor: pointer; color: var(--heading); }

.sub { display: block; font-style: normal; font-size: .74rem; color: var(--muted); font-weight: 500; }
.crumbs { padding: .3rem 1rem .6rem; color: var(--muted); font-size: .88rem; }

/* ── Тостове ── */
#toasts { position: fixed; z-index: 200; bottom: 1rem; left: 50%; transform: translateX(-50%); display: grid; gap: .5rem; width: min(92vw, 420px); pointer-events: none; }
.toast { pointer-events: auto; padding: .7rem 1rem; border-radius: 14px; background: var(--surface); color: var(--heading); border: var(--bw) solid var(--accent); box-shadow: var(--glow-shadow), 0 10px 30px rgba(0,0,0,.5); animation: fadeUp .35s var(--ease) both; }

.foot { display: flex; justify-content: space-between; gap: .6rem; flex-wrap: wrap; padding: 1rem; border-top: var(--bw) solid var(--border); font-size: .85rem; color: var(--muted); }
.spinner { width: 1.6rem; height: 1.6rem; border-radius: 50%; border: 3px solid var(--faint); border-top-color: var(--accent); animation: spin .8s linear infinite; margin: 2rem auto; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Без анимации ── */
.no-anim *, .no-anim *::before, .no-anim *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }

    else if (status === 'canceled' || status === 'missed') callLog(c, `📞 Пропуснато ${lbl(c)} обаждане`);
    else if (status === 'declined') callLog(c, `📞 Отказано ${lbl(c)} обаждане`);
  };
  const callTick = () => {
    for (const c of db.calls) {
      if (c.status !== 'ringing') continue;
      const demoCallee = demo.some(d => d.id === c.callee), age = Date.now() - c.created;
      if (demoCallee && age > 2500) { c.status = 'active'; c.answered = Date.now(); }          // демо профилът вдига след малко
      else if (age > 45000) callEnd(c, 'missed');
    }
  };
  const callView = (c, me) => { const otherId = c.caller === me.id ? c.callee : c.caller; const o = all().find(u => u.id === otherId);
    return { id: c.id, kind: c.kind, status: c.status, conversationId: c.cid, incoming: c.callee === me.id, peer: o ? pub(o, me.id) : null, answeredAt: c.answered ? iso(c.answered) : null, createdAt: iso(c.created), demo: true }; };
  route('POST', /^\/api\/calls$/, active(({ body: b, me }) => {
    if (!['audio', 'video'].includes(b.kind)) return bad('Невалиден вид обаждане.');
    const conv = convById(Number(b.conversationId)); if (!conv || conv.kind !== 'direct' || !memberOf(conv, me.id)) return bad('Обаждания има само в лични разговори.', 404);
    const peer = peerUser(conv, me); if (!peer) return bad('Не можете да се обадите на този профил.', 403);
    callTick(); if (openCall(me.id)) return errc('Вече си в обаждане.', 409, 'busy_self');

    const c = { id: ++db.seq, cid: conv.id, caller: me.id, callee: peer.id, kind: b.kind, status: 'ringing', created: Date.now(), answered: null, ended: null }; db.calls.push(c); save();
    return ok({ call: callView(c, me) }, 201);
  }));
  route('GET', /^\/api\/calls\/poll$/, authed(({ q, me }) => {

      const teddy = demo.find(d => d.nickname === 'Теди'), conv = teddy && db.convs.find(c => c.kind === 'direct' && memberOf(c, me.id) && memberOf(c, teddy.id));
      if (conv && Date.now() - db.firstPoll > 20000 && !openCall(me.id)) { db.calls.push({ id: ++db.seq, cid: conv.id, caller: teddy.id, callee: me.id, kind: 'video', status: 'ringing', created: Date.now(), answered: null, ended: null }); db.demoRang = true; }
      save();
    }

    const id = Number(q.get('callId')) || 0;
    const c = id ? db.calls.find(x => x.id === id && (x.caller === me.id || x.callee === me.id)) : openCall(me.id);
    return ok({ call: c ? callView(c, me) : null, signals: [] });
  }));
  const myCall = (m, me) => db.calls.find(x => x.id === Number(m[1]) && (x.caller === me.id || x.callee === me.id));
  route('POST', /^\/api\/calls\/(\d+)\/signal$/, authed(({ m, me }) => (myCall(m, me) ? ok({ id: 0 }, 201) : bad('Обаждането не е намерено.', 404))));
  route('POST', /^\/api\/calls\/(\d+)\/answer$/, authed(({ m, me }) => { const c = myCall(m, me); if (!c) return bad('Обаждането не е намерено.', 404);
    if (c.callee !== me.id || c.status !== 'ringing') return bad('Не можеш да вдигнеш това обаждане.', 403); c.status = 'active'; c.answered = Date.now(); save(); return ok({ call: callView(c, me) }); }));
  route('POST', /^\/api\/calls\/(\d+)\/decline$/, authed(({ m, me }) => { const c = myCall(m, me); if (!c) return bad('Обаждането не е намерено.', 404);
    if (c.callee !== me.id || c.status !== 'ringing') return bad('Не можеш да откажеш това обаждане.', 403); callEnd(c, 'declined'); save(); return ok({ ok: true }); }));
  route('POST', /^\/api\/calls\/(\d+)\/end$/, authed(({ m, me }) => { const c = myCall(m, me); if (!c) return bad('Обаждането не е намерено.', 404);
    if (['ringing', 'active'].includes(c.status)) callEnd(c, c.status === 'ringing' ? (c.caller === me.id ? 'canceled' : 'declined') : 'ended'); save(); return ok({ ok: true }); }));

  // ── Доклади ──
  route('POST', /^\/api\/profiles\/(\d+)\/report$/, active(({ m, body: b, me }) => {
    const id = Number(m[1]);

    if (!Object.hasOwn(D.reportReasons, b.reason)) return bad('Изберете причина за доклада.');

    db.reports.push({ id: ++db.rseq, reporterId: me.id, reportedId: id, reporterNick: me.nickname, reportedNick: target.nickname, reason: b.reason, details, status: 'open', note: '', created: Date.now(), resolvedAt: null, views: 0,

  const LABEL = k => D.reportReasons[k] || k;
  const rrow = r => ({ id: r.id, dossierId: r.dossierId, reporterNick: r.reporterNick, reportedNick: r.reportedNick, reason: r.reason, reasonLabel: LABEL(r.reason), status: r.status, createdAt: iso(r.created), resolvedAt: r.resolvedAt ? iso(r.resolvedAt) : null });
  route('GET', /^\/api\/admin\/reports$/, adminOnly(({ q }) => {
    const st = ['open', 'upheld', 'dismissed'].includes(q.get('status')) ? q.get('status') : null;
    const counts = { open: 0, upheld: 0, dismissed: 0 }; db.reports.forEach(r => counts[r.status]++);
    const list = db.reports.filter(r => !st || r.status === st).sort((a, b) => (b.status === 'open') - (a.status === 'open') || b.id - a.id);

  }));
  route('GET', /^\/api\/admin\/reports\/(\d+)$/, adminOnly(({ m }) => {
    const r = db.reports.find(x => x.id === Number(m[1])); if (!r) return bad('Докладът не е намерен.', 404);

    const reported = u ? { id: u.id, nickname: u.nickname, age: ageOf(u), ...placeFields(u), gender: u.gender, bio: u.bio, isDemo: !!u.isDemo, createdAt: iso(Date.now() - (u.created || 0) * 1000), photos: u.photos.length,

    return ok({ report: { ...rrow(r), details: r.details, adminNote: r.note, reporterStillExists: !!all().find(x => x.id === r.reporterId), reportedStillExists: !!u }, reported,
      messages: r.msgs.map((x, i) => ({ id: i + 1, fromReporter: x.role === 'reporter', role: x.role, from: x.from, body: x.body, at: iso(x.at), attachment: attView(x.att) })),
      conversation: r.convTitle ? { title: r.convTitle, group: true } : null, views: r.views });
  }));
  route('PUT', /^\/api\/admin\/reports\/(\d+)$/, adminOnly(({ m, body: b }) => {
    const r = db.reports.find(x => x.id === Number(m[1])); if (!r) return bad('Докладът не е намерен.', 404);
    if (!['open', 'upheld', 'dismissed'].includes(b.status)) return bad('Невалиден статус.');
    const note = String(b.note || '').trim(); if (note.length > 500) return bad('Бележката може да е до 500 символа.');
    r.status = b.status; r.note = note; r.resolvedAt = b.status === 'open' ? null : Date.now(); save(); return ok({ ok: true });
  }));

  // ── Досиета, наказания, обжалвания (същата логика като на сървъра) ──
  const adminPen = p => ({ ...penView(p), note: p.note, issuedNick: p.issuedNick, liftedAt: p.liftedAt ? iso(p.liftedAt) : null, liftedNote: p.liftedNote,
    appealAt: p.appealAt ? iso(p.appealAt) : null, appealDecidedAt: p.appealDecidedAt ? iso(p.appealDecidedAt) : null, reportId: p.reportId, active: p.kind === 'suspension' && !p.liftedAt && p.endsAt > Date.now() });
  const clean = (v, max) => String(v || '').trim().slice(0, max);
  const eraseUser = id => {
    db.users = db.users.filter(u => u.id !== id); db.likes = db.likes.filter(l => l.from !== id && l.to !== id); db.blocks = db.blocks.filter(b => b.from !== id && b.to !== id); delete db.verif[id];
    for (const c of db.convs.slice()) {
      if (!memberOf(c, id)) continue;
      if (c.kind === 'direct') { db.convs = db.convs.filter(x => x !== c); db.messages = db.messages.filter(m => m.cid !== c.id); }
      else { c.members = c.members.filter(m => m.id !== id); if (!c.members.length) { db.convs = db.convs.filter(x => x !== c); db.messages = db.messages.filter(m => m.cid !== c.id); } else if (!c.members.some(m => m.role === 'owner')) c.members[0].role = 'owner'; }
    }
    if (db.session === id) db.session = null;
  };
  route('GET', /^\/api\/admin\/dossiers$/, adminOnly(({ q }) => {
    const status = q.get('status') || 'all', term = (q.get('q') || '').trim().toLowerCase();
    let list = db.dossiers.slice().map(d => {
      const reps = db.reports.filter(r => r.dossierId === d.id), sp = d.userId ? activeSusp(d.userId) : null;
      return { id: d.id, nickname: d.nickname, status: d.status, reports: reps.length, openReports: reps.filter(r => r.status === 'open').length, strikes: strikesOf(d.id), strikeLimit: STRIKE_LIMIT,
        suspendedUntil: sp ? iso(sp.endsAt) : null, appeals: db.penalties.filter(p => p.dossierId === d.id && p.appealStatus === 'pending').length,
        lastReportAt: reps.length ? iso(Math.max(...reps.map(r => r.created))) : null, createdAt: iso(d.createdAt), _t: reps.length ? Math.max(...reps.map(r => r.created)) : 0 };
    }).sort((a, b) => (b.openReports > 0) - (a.openReports > 0) || b._t - a._t);
    list.forEach(d => delete d._t);
    if (term) list = list.filter(d => d.nickname.toLowerCase().includes(term));
    if (status === 'suspended') list = list.filter(d => d.suspendedUntil); else if (status === 'deregistered') list = list.filter(d => d.status === 'deregistered');
    else if (status === 'appeals') list = list.filter(d => d.appeals > 0); else if (status === 'active') list = list.filter(d => d.status === 'active');
    return ok({ dossiers: list });
  }));
  route('GET', /^\/api\/admin\/dossiers\/(\d+)$/, adminOnly(({ m }) => {
    const d = db.dossiers.find(x => x.id === Number(m[1])); if (!d) return bad('Досието не е намерено.', 404);
    const u = d.userId ? all().find(x => x.id === d.userId) : null;
    const subject = u ? { alive: true, id: u.id, nickname: u.nickname, age: ageOf(u), ...placeFields(u), gender: u.gender, bio: u.bio, goal: u.goal || '', isDemo: !!u.isDemo, paused: !!u.paused, joinedAt: iso(Date.now() - (u.created || 0) * 1000),
      lastSeen: iso(Date.now()), emailMasked: maskEmail(u.email), emailVerified: isVerified(u), photos: u.photos.length } : { alive: false, nickname: d.nickname, ...(d.snapshot || {}) };
    const strikes = strikesOf(d.id);
    return ok({
      dossier: { id: d.id, nickname: d.nickname, status: d.status, createdAt: iso(d.createdAt), closedAt: d.closedAt ? iso(d.closedAt) : null, closedReason: d.closedReason }, subject,
      reports: db.reports.filter(r => r.dossierId === d.id).sort((a, b) => b.id - a.id).map(r => ({ ...rrow(r), details: r.details, adminNote: r.note, convTitle: r.convTitle })),
      penalties: db.penalties.filter(p => p.dossierId === d.id).sort((a, b) => b.id - a.id).map(adminPen),
      notes: db.notes.filter(n => n.dossierId === d.id).sort((a, b) => b.id - a.id).map(n => ({ id: n.id, note: n.note, admin: n.admin, at: iso(n.at) })),
      strikes, strikeLimit: STRIKE_LIMIT, recommendDeregister: strikes >= STRIKE_LIMIT && d.status === 'active', suspendDays: D.suspendDays, emailBanned: d.status === 'deregistered' });
  }));
  route('POST', /^\/api\/admin\/dossiers\/(\d+)\/notes$/, adminOnly(({ m, body: b }) => {
    const d = db.dossiers.find(x => x.id === Number(m[1])); if (!d) return bad('Досието не е намерено.', 404);
    const note = clean(b.note, 1000); if (note.length < 2) return bad('Напиши бележка.');
    db.notes.push({ id: ++db.seq, dossierId: d.id, note, admin: 'Админ', at: Date.now() }); save(); return ok({ ok: true }, 201);
  }));
  route('POST', /^\/api\/admin\/dossiers\/(\d+)\/penalties$/, adminOnly(({ m, body: b }) => {
    const d = db.dossiers.find(x => x.id === Number(m[1])); if (!d) return bad('Досието не е намерено.', 404);
    if (!d.userId || d.status !== 'active') return bad('Профилът вече не е активен.', 409);

    const days = b.kind === 'suspension' ? Number(b.days) : null;
    if (b.kind === 'suspension' && !D.suspendDays.includes(days)) return bad(`Суспензията е ${D.suspendDays.join(', ')} дни.`);
    const reason = clean(b.reason, 300); if (reason.length < 5) return bad('Напиши причина (поне 5 символа) – показва се на потребителя.');
    const now = Date.now();
    const pen = { id: ++db.seq, dossierId: d.id, userId: d.userId, kind: b.kind, reason, note: clean(b.note, 500), days, reportId: null, issuedNick: 'Админ', at: now, endsAt: days ? now + days * 864e5 : null,
      liftedAt: null, liftedNote: '', ackedAt: null, appealText: '', appealAt: null, appealStatus: 'none', appealNote: '', appealDecidedAt: null };

  }));
  route('POST', /^\/api\/admin\/penalties\/(\d+)\/lift$/, adminOnly(({ m, body: b }) => {
    const p = db.penalties.find(x => x.id === Number(m[1])); if (!p || p.kind === 'deregistration') return bad('Наказанието не е намерено.', 404);

  }));
  route('POST', /^\/api\/admin\/penalties\/(\d+)\/appeal$/, adminOnly(({ m, body: b }) => {
    const p = db.penalties.find(x => x.id === Number(m[1])); if (!p || p.appealStatus !== 'pending') return bad('Няма чакащо обжалване.', 404);

    save(); return ok({ ok: true });
  }));
  route('POST', /^\/api\/admin\/dossiers\/(\d+)\/deregister$/, adminOnly(({ m, body: b }) => {
    const d = db.dossiers.find(x => x.id === Number(m[1])); if (!d) return bad('Досието не е намерено.', 404);
    if (!d.userId || d.status !== 'active') return bad('Профилът вече не е активен.', 409);

    if (u.emailKey && !db.banned.includes(u.emailKey)) db.banned.push(u.emailKey);
    if (u.username) db.dereg.push(u.username.toLowerCase());
    db.penalties.push({ id: ++db.seq, dossierId: d.id, userId: null, kind: 'deregistration', reason, note: clean(b.note, 500), days: null, reportId: null, issuedNick: 'Админ', at: Date.now(), endsAt: null, liftedAt: null, liftedNote: '', ackedAt: null, appealText: '', appealAt: null, appealStatus: 'none', appealNote: '', appealDecidedAt: null });
    d.status = 'deregistered'; d.closedReason = reason; d.closedAt = Date.now(); d.userId = null;
    if (u.isDemo) { demo.splice(demo.indexOf(u), 1); db.gone.push(u.id); db.likes = db.likes.filter(l => l.from !== u.id && l.to !== u.id); } else eraseUser(u.id);
    save(); return ok({ ok: true });
  }));
  // За самия потребител: прочитане и обжалване
  route('POST', /^\/api\/me\/penalties\/(\d+)\/ack$/, authed(({ m, me }) => {
    const p = db.penalties.find(x => x.id === Number(m[1]) && x.userId === me.id && x.kind === 'warning'); if (!p) return bad('Не е намерено.', 404);
    p.ackedAt = Date.now(); save(); return ok({ user: full(me) });
  }));
  route('POST', /^\/api\/me\/penalties\/(\d+)\/appeal$/, authed(({ m, body: b, me }) => {
    const p = db.penalties.find(x => x.id === Number(m[1]) && x.userId === me.id && ['warning', 'suspension'].includes(x.kind)); if (!p) return bad('Не е намерено.', 404);
    if (p.appealStatus !== 'none') return bad('Вече си обжалвал това наказание.', 409);
    const text = clean(b.text, 500); if (text.length < 10) return bad('Опиши защо смяташ, че е грешка (поне 10 символа).');
    p.appealText = text; p.appealAt = Date.now(); p.appealStatus = 'pending'; save(); return ok({ user: full(me) });
  }));

  const realFetch = window.fetch.bind(window);
  window.fetch = async (url, opt = {}) => {
    const u = new URL(String(url), 'http://x');
    if (!u.pathname.startsWith('/api/')) return realFetch(url, opt);
    const method = (opt.method || 'GET').toUpperCase();
    const isBlob = typeof Blob !== 'undefined' && opt.body instanceof Blob;
    let body = {}; try { body = opt.body && !isBlob ? JSON.parse(opt.body) : {}; } catch { /* ignore */ }
    for (const [m, re, fn] of routes) {
      const match = re.exec(u.pathname);
      if (m === method && match) { await new Promise(r => setTimeout(r, 60)); return fn({ body, blob: isBlob ? opt.body : null, headers: opt.headers || {}, q: u.searchParams, m: match }); }
    }
    return bad('Няма такъв маршрут.', 404);
  };

  // Бележка в долния ред
  document.addEventListener('DOMContentLoaded', () => {
    const f = document.querySelector('.foot');
    if (f) { const s = document.createElement('span'); s.className = 'dim'; s.textContent = 'Преглед: данните ти остават само в този браузър.'; f.append(s); }
  });
})();

<script>
// Spark емотиконки: собствен комплект от 28 векторни емотиконки във фирмените цветове + обикновени емоджита.
// В съобщенията се пишат като :име: (напр. :smile:) и се показват като картинки.
(() => {
  'use strict';
  const INK = '#07203f';
  const ST = (w = 3) => `stroke="${INK}" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-linejoin="round"`;
  const HEART = 'M32 57C6 38 4 18 16 11c8-5 14 0 16 6 2-6 8-11 16-6 12 7 10 27-16 46z';
  const heartAt = (x, y, k, fill = '#ff4f7b') => `<path transform="translate(${x} ${y}) scale(${k})" d="M0 9C-14 -1 -9 -12 0 -6C9 -12 14 -1 0 9z" fill="${fill}"/>`;

  const GRADS = {
    b: ['#fff08a', '#ffb800'],            // основен жълт (като класическите емоджита)
    r: ['#ffb199', '#e0452b'],            // ядосан
    h: ['#ff9ec0', '#e0245e'],            // сърце
    o: ['#ffe27a', '#ff6a1a'],            // огън
    g: ['#fff0a0', '#ffb300'],            // злато
    c: ['#e9fbff', '#4cc9ff'],            // лед
    p: ['#ffc2f0', '#8a5cff'],            // лилаво
  };
  const defs = k => `<defs><radialGradient id="g" cx=".32" cy=".26" r=".95"><stop offset="0" stop-color="${GRADS[k][0]}"/><stop offset="1" stop-color="${GRADS[k][1]}"/></radialGradient></defs>`;

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k === 'style') {
      // CSP забранява style="" атрибути → задаваме свойствата през CSSOM.
      for (const decl of String(v).split(';')) {
        const i = decl.indexOf(':');
        if (i > 0) el.style.setProperty(decl.slice(0, i).trim(), decl.slice(i + 1).trim());
      }
    }
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'value') el.value = v;
    else if (k === 'checked' || k === 'selected' || k === 'disabled') el[k] = !!v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

  const opt = { method, credentials: 'same-origin', headers: {} };
  if (body !== undefined) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  let res;
  try { res = await fetch(url, opt); } catch { throw Object.assign(new Error('Няма връзка със сървъра.'), { status: 0 }); }

// Сървърната тема печели, освен ако локално има по-нова, още неизпратена промяна.
function adoptServerTheme(user) {
  if (!user) return;
  const server = user.theme && Object.keys(user.theme).length ? user.theme : null;
  if (isDirty() || !server) { pendingRemote = true; pushTheme(false); }
  else { applyTheme(server); saveLocal(); }
}

async function afterAuth(user, isNew) {
  resetDisc();
  state.me = user;
  adoptServerTheme(user);
  location.hash = isNew ? '#profile' : '#discover';
  route();
  toast(isNew ? `Добре дошъл, ${user.nickname}! Добави снимки и био.` : `Здравей отново, ${user.nickname}!`);
}

/* ═══════════ Моят профил ═══════════ */
function resizeImage(file, maxSide = 1100) {
  return new Promise((resolve, reject) => {
    if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return reject(new Error('Позволени са само JPG, PNG и WebP.'));
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, maxSide / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.86));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Файлът не може да бъде прочетен като снимка.')); };
    img.src = url;
  });
}

// Смалява голяма снимка до Blob (без fetch на data: – CSP го забранява). Връща null, ако не е нужно смаляване.
function resizeToBlob(file, maxSide = 1600) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const k = Math.min(1, maxSide / Math.max(img.width, img.height));
      if (k === 1 && file.size < 1.5 * 1048576) return resolve(null);
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => (b ? resolve(b) : reject(new Error('resize'))), 'image/jpeg', 0.86);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('img')); };
    img.src = url;
  });
}

/* ═══════════ Чат: общ компонент, групи, файлове, емотиконки ═══════════ */
const MAX_FILE_MB = 10;
const fmtSize = n => (n < 1024 ? `${n} B` : n < 1048576 ? `${Math.round(n / 1024)} KB` : `${(n / 1048576).toFixed(1)} MB`);
const nickColor = nick => { let x = 7; for (const c of nick) x = (x * 31 + c.codePointAt(0)) >>> 0; return `hsl(${(x % 300) + 20} 85% 74%)`; };
const fileIcon = name => {
  const e = (name.split('.').pop() || '').toLowerCase();
  if (e === 'pdf') return '📕';
  if (['doc', 'docx', 'odt', 'rtf', 'txt'].includes(e)) return '📝';
  if (['xls', 'xlsx', 'csv', 'ods'].includes(e)) return '📊';
  if (['ppt', 'pptx', 'odp'].includes(e)) return '📽️';
  if (['zip', 'rar', '7z', 'gz', 'tar'].includes(e)) return '🗜️';
  if (['mp3', 'wav', 'ogg', 'm4a', 'flac'].includes(e)) return '🎵';
  if (['mp4', 'mov', 'webm', 'avi', 'mkv'].includes(e)) return '🎬';
  return '📎';
};
// Групова аватарка: до 3 инициала върху градиент.
function groupAvatar(title, size = 44) {
  let x = 3; for (const c of title) x = (x * 31 + c.codePointAt(0)) >>> 0;
  const hue = 190 + (x % 80);
  const el = h('span', { class: 'gav', 'aria-hidden': 'true', text: [...title.trim()][0] ? [...title.trim()][0].toUpperCase() : '👥' });
  el.style.setProperty('--gh', String(hue)); el.style.setProperty('--gs', size + 'px');
  return el;
}
const chatAvatar = (c, size = 44) => (c.kind === 'group' ? groupAvatar(c.title, size) : h('img', { src: mainPhoto(c.peer), alt: '', width: String(size), height: String(size) }));
const lastLine = c => {
  const l = c.last, who = l.system ? '' : l.mine ? 'Ти: ' : c.kind === 'group' && l.senderNick ? l.senderNick + ': ' : '';
  return who + l.body.replace(/:([a-z]+):/g, (m, n) => (SparkEmo.labels[n] ? '🙂' : m));
};

// Преглед на снимки на цял екран: стрелки, клавиши ←/→/Esc, плъзване, увеличение с клик/двоен тап.
let viewerEl = null, viewerKey = null;
function closeViewer() {
  if (!viewerEl) return;
  viewerEl.remove(); viewerEl = null;
  window.removeEventListener('keydown', viewerKey, true); viewerKey = null;
  if (!$('#modalRoot').firstChild) document.body.style.overflow = '';
}
function openViewer(items, start = 0) {
  closeViewer();
  items = items.filter(Boolean);
  if (!items.length) return;
  let i = Math.min(Math.max(start, 0), items.length - 1), zoomed = false, x0 = null;
  const img = h('img', { class: 'vimg', alt: '', draggable: 'false' });
  const count = h('span', { class: 'vcount' });
  const dl = h('a', { class: 'vbtn vdl', 'aria-label': 'Свали', title: 'Свали', text: '⬇' });
  const prev = h('button', { class: 'vbtn vnav vprev', type: 'button', 'aria-label': 'Предишна', text: '‹', onclick: () => go(-1) });
  const next = h('button', { class: 'vbtn vnav vnext', type: 'button', 'aria-label': 'Следваща', text: '›', onclick: () => go(1) });
  const cap = h('div', { class: 'vcap' });
  const stage = h('div', { class: 'vstage' }, img);
  const setZoom = z => { zoomed = z; img.classList.toggle('zoom', z); stage.classList.toggle('zoomed', z); };
  function show() {
    const it = items[i];
    setZoom(false);
    img.src = it.url; img.alt = it.alt || '';
    cap.textContent = it.caption || '';
    count.textContent = items.length > 1 ? `${i + 1} / ${items.length}` : '';
    prev.hidden = next.hidden = items.length < 2;
    if (it.download) { dl.href = it.url; dl.setAttribute('download', it.download); dl.hidden = false; } else dl.hidden = true;
  }
  function go(d) { i = (i + d + items.length) % items.length; show(); }
  stage.addEventListener('click', e => { if (e.target === stage) closeViewer(); });
  img.addEventListener('click', () => setZoom(!zoomed));
  stage.addEventListener('touchstart', e => { x0 = !zoomed && e.touches.length === 1 ? e.touches[0].clientX : null; }, { passive: true });
  stage.addEventListener('touchend', e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 50 && items.length > 1) go(dx < 0 ? 1 : -1);
  });
  viewerKey = e => {
    if (e.key === 'Escape') closeViewer();
    else if (e.key === 'ArrowLeft' && items.length > 1) go(-1);
    else if (e.key === 'ArrowRight' && items.length > 1) go(1);
    else return;
    e.preventDefault(); e.stopImmediatePropagation();
  };
  window.addEventListener('keydown', viewerKey, true);
  viewerEl = h('div', { class: 'viewer', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Преглед на снимка' },
    h('div', { class: 'vbar' }, count, h('span', { class: 'vsp' }), dl, h('button', { class: 'vbtn', type: 'button', 'aria-label': 'Затвори', text: '✕', onclick: closeViewer })),
    stage, prev, next, cap);
  document.body.append(viewerEl);
  document.body.style.overflow = 'hidden';
  show();
}

function openLightbox(att) { openViewer([{ url: att.url, alt: att.name, caption: `${att.name} · ${fmtSize(att.size)}`, download: att.name }]); }
function attachmentNode(a) {
  if (a.kind === 'image') return h('button', { class: 'att-img', type: 'button', 'aria-label': `Отвори снимка ${a.name}`, onclick: () => openLightbox(a) }, h('img', { src: a.url, alt: a.name, loading: 'lazy' }));

      h('button', { type: 'button', role: 'tab', 'aria-selected': String(tab === 'uni'), text: '😊 Емоджи', onclick: () => { tab = 'uni'; paint(); } }));

    } else {

// Общият чат панел (за кръгчето и за страницата „Съобщения“).
function createChatPane({ compact, onBack, onFull, onCollapse, onChanged }) {
  const root = h('div', { class: 'chatpane' });
  const headEl = h('div', { class: 'win-head' });
  const listEl = h('div', { class: 'msgs', 'aria-live': 'polite' });

    onkeydown: e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } },
    onpaste: e => { const f = e.clipboardData && [...e.clipboardData.files].find(x => x.type.startsWith('image/')); if (f) { e.preventDefault(); attach(f); } } });
  const fileIn = h('input', { type: 'file', class: 'sr', 'aria-label': 'Избери файл', onchange: e => { if (e.target.files[0]) attach(e.target.files[0]); e.target.value = ''; } });
  const sendBtn = h('button', { class: 'btn sm', type: 'button', text: 'Изпрати', onclick: () => send() });
  const attBtn = h('button', { class: 'xbtn', type: 'button', title: 'Прикачи снимка или файл', 'aria-label': 'Прикачи снимка или файл', text: '📎', onclick: () => fileIn.click() });
  const emoBtn = h('button', { class: 'xbtn emotoggle', type: 'button', 'data-emotoggle': '1', title: 'Емотиконки', 'aria-label': 'Емотиконки', onclick: () => togglePop() }, SparkEmo.img('smile', 'emo-btn'));
  const composer = h('div', { class: 'composer' }, attBtn, emoBtn, input, sendBtn, fileIn);
  root.append(headEl, listEl, noteEl, pendEl, composer);

  let convId = null, data = null, sig = '', pending = null, uploading = false, pop = null, token = 0;
  const conv = () => (data ? data.conversation : null);

  function togglePop() {
    if (pop) { closePop(); return; }
    pop = emojiPopover(txt => { insertAtCursor(txt); }, closePop);
    composer.append(pop);
  }
  function closePop() { if (pop) { pop.close(); pop.remove(); pop = null; } }
  function insertAtCursor(txt) {
    const s = input.selectionStart ?? input.value.length, e = input.selectionEnd ?? s;
    input.value = input.value.slice(0, s) + txt + input.value.slice(e);
    input.focus(); const pos = s + txt.length; input.setSelectionRange(pos, pos);
  }

  function setPending(p) {
    pending = p; clear(pendEl); pendEl.hidden = !p;
    if (!p) return;
    pendEl.append(p.previewUrl ? h('img', { src: p.previewUrl, alt: '' }) : h('span', { class: 'ficon', text: fileIcon(p.name) }),
      h('span', { class: 'finfo' }, h('b', { text: p.name }), h('small', { text: p.uploading ? 'Качва се…' : fmtSize(p.size) })),
      h('button', { class: 'xbtn', type: 'button', 'aria-label': 'Махни файла', text: '✕', onclick: () => setPending(null) }));
  }

  async function attach(file) {
    if (!convId) return;
    if (file.size > MAX_FILE_MB * 1048576) { toast(`Файлът е твърде голям (макс. ${MAX_FILE_MB} MB).`, true); return; }
    let body = file, name = file.name || 'снимка.png', previewUrl = null;
    try {
      if (/^image\/(jpeg|png|webp)$/.test(file.type)) {
        const small = await resizeToBlob(file, 1600);
        if (small) { body = small; name = name.replace(/\.[^.]+$/, '') + '.jpg'; }
        previewUrl = URL.createObjectURL(body);
      } else if (file.type === 'image/gif') previewUrl = URL.createObjectURL(file);
    } catch { /* ако не може да се смали, качваме оригинала */ }
    setPending({ name, size: body.size, previewUrl, uploading: true }); uploading = true; sendBtn.disabled = true;
    const mine = convId;
    try {
      const res = await fetch(`/api/chats/${mine}/attachments`, { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/octet-stream', 'X-Filename': encodeURIComponent(name) }, body });
      const j = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(j.error || 'Файлът не беше качен.');
      if (mine !== convId) return;
      setPending({ id: j.attachment.id, name: j.attachment.name, size: j.attachment.size, previewUrl });

  async function send() {

    sendBtn.disabled = true;

      data.messages.push(r.message); input.value = ''; setPending(null); closePop();
      renderList(true); onChanged && onChanged();
    } catch (x) { toast(x.message, true); } finally { sendBtn.disabled = uploading; }
  }

  function bubble(m) {
    if (m.kind === 'system') return h('div', { class: 'sysmsg', text: m.body });
    const group = conv().kind === 'group', r = m.body ? SparkEmo.render(m.body) : null;
    const el = h('div', { class: 'bubble ' + (m.mine ? 'mine' : 'theirs') + (r && r.big && !m.attachment ? ' emobig' : '') });
    if (group && !m.mine) el.append(h('small', { class: 'from', style: `color:${nickColor(m.senderNick || '?')}`, text: m.senderNick || 'Изтрит профил' }));
    if (m.attachment) el.append(attachmentNode(m.attachment));

    if (!force && next === sig) return;
    const nearBottom = listEl.scrollHeight - listEl.scrollTop - listEl.clientHeight < 80 || sig === '';

    if (!data) { listEl.append(h('div', { class: 'spinner', role: 'progressbar', 'aria-label': 'Зареждане' })); return; }
    if (!msgs.length) listEl.append(h('p', { class: 'dim', style: 'text-align:center;margin:auto', text: 'Напиши първото съобщение.' }));

  function renderHead() {

    const group = c.kind === 'group';
    const peer = c.peer;
    headEl.append(...[
      onBack ? h('button', { class: 'xbtn' + (compact ? '' : ' backbtn'), type: 'button', 'aria-label': 'Към разговорите', title: 'Към списъка', text: '←', onclick: onBack }) : null,
      group ? groupAvatar(c.title, 32) : h('img', { class: 'mini', src: peer ? mainPhoto(peer) : avatar('?', ''), alt: '', width: '32', height: '32' }),

        : [peer ? h('a', { href: '#discover', text: peer.nickname, onclick: e => { e.preventDefault(); openProfile(peer); } }) : c.title, peer ? h('small', { class: 'dim', text: ` · ${peer.city}` }) : null]),
      ...(group ? [h('button', { class: 'xbtn', style: 'margin-left:auto', type: 'button', 'aria-label': 'Информация за групата', title: 'Група', text: '👥', onclick: () => groupInfoDialog(c, reload) })]

                      h('button', { class: 'xbtn callbtn', type: 'button', 'aria-label': 'Видео обаждане', title: 'Видео обаждане', text: '🎥', onclick: () => startCall(c, 'video') }),

  async function reload(force) {

// Звънене от чата (само личен разговор).

function deregisterDialog(d, done) {

    btn.disabled = true;
    try { await api('POST', `/api/admin/dossiers/${d.dossier.id}/deregister`, { reason: reason.value, note: note.value }); closeModal(); toast(`${d.dossier.nickname} е дерегистриран. Имейлът му е забранен.`); done(); }
    catch (x) { err.textContent = x.message; btn.disabled = false; }
  } },
    h('div', { class: 'banner danger', style: 'margin-bottom:1rem' }, h('span', { class: 'bico', text: '⛔' }), h('div', { class: 'btxt' }, h('b', { text: 'Необратимо действие' }),
      h('span', { text: 'Профилът, снимките и личните му разговори се изтриват. С неговия имейл (и негови варианти с точки и +етикет) няма да може да се регистрира отново. Досието и доказателствата в докладите остават.' }))),
    h('div', { class: 'field' }, h('label', { for: 'dr-reason', text: 'Причина' }), reason),
    h('div', { class: 'field' }, h('label', { for: 'dr-note', text: 'Вътрешна бележка' }), note),
    err, h('div', { class: 'actions' }, btn, h('button', { class: 'btn ghost', type: 'button', text: 'Отказ', onclick: closeModal }))),
  { narrow: true, title: `Дерегистрация: ${d.dossier.nickname}` });
}

// Казус: данни за доклада + снимка на разговора + решение на администратора.
async function openCase(id, changed) {
  let d;
  try { d = await api('GET', `/api/admin/reports/${id}`); } catch (x) { toast(x.message, true); return; }
  const r = d.report, STATUS = { open: 'Отворен', upheld: 'Основателен', dismissed: 'Неоснователен' };
  const note = h('textarea', { id: 'case-note', maxlength: '500', placeholder: 'Бележка към решението (по желание)', style: 'min-height:5rem' });
  note.value = r.adminNote || '';
  const decide = async status => {
    try { await api('PUT', `/api/admin/reports/${id}`, { status, note: note.value }); toast(status === 'open' ? 'Докладът е върнат като отворен.' : 'Решението е записано.'); closeModal(); changed && changed(); }
    catch (x) { toast(x.message, true); }
  };
  let armed = false;
  const delBtn = h('button', { class: 'btn danger', type: 'button', text: 'Изтрий профила на докладвания' });
  delBtn.addEventListener('click', async () => {
    if (!armed) { armed = true; delBtn.textContent = 'Сигурен ли си? Натисни пак'; setTimeout(() => { armed = false; delBtn.textContent = 'Изтрий профила на докладвания'; }, 3500); return; }
    try { await api('DELETE', `/api/admin/users/${d.reported.id}`); toast('Профилът е изтрит. Доказателствата в доклада остават.'); closeModal(); changed && changed(); }
    catch (x) { toast(x.message, true); }
  });

  const transcript = h('div', { class: 'transcript', tabindex: '0', 'aria-label': 'Разговор към момента на доклада' });
  if (!d.messages.length) transcript.append(h('p', { class: 'dim', style: 'margin:auto;text-align:center', text: 'Към момента на доклада няма разменени съобщения между двамата.' }));
  let day = '';
  for (const m of d.messages) {
    const dd = fmtDate(m.at);
    if (dd !== day) { day = dd; transcript.append(h('div', { class: 'daysep', text: dd })); }
    if (m.role === 'system') { transcript.append(h('div', { class: 'sysmsg', text: m.body })); continue; }
    const r = m.body ? SparkEmo.render(m.body) : null;
    const label = m.from + (m.role === 'reporter' ? ' (докладва)' : m.role === 'reported' ? ' (докладван)' : '');
    transcript.append(h('div', { class: 'bubble ' + (m.role === 'reporter' ? 'mine' : m.role === 'reported' ? 'accused' : 'theirs') },
      h('small', { class: 'from', text: label }), m.attachment ? attachmentNode(m.attachment) : null, r ? h('span', { class: 'txt' }, ...r.nodes) : null, h('time', { datetime: m.at, text: fmtTime(m.at) })));
  }

  const rep = d.reported;
  openModal(h('div', {},
    h('div', { class: 'two' },
      h('div', {},
        h('dl', { class: 'facts' },
          h('dt', { text: 'Статус' }), h('dd', {}, h('span', { class: 'tag st-' + r.status, text: STATUS[r.status] })),
          h('dt', { text: 'Причина' }), h('dd', { text: r.reasonLabel }),
          h('dt', { text: 'Подаден' }), h('dd', { text: fmtWhen(r.createdAt) }),
          h('dt', { text: 'Докладва' }), h('dd', { text: r.reporterNick + (r.reporterStillExists ? '' : ' (акаунтът е изтрит)') }),
          h('dt', { text: 'Докладван' }), h('dd', { text: r.reportedNick + (rep ? '' : ' (акаунтът е изтрит)') }),
          h('dt', { text: 'Прегледи' }), h('dd', { text: `${d.views}× от администратори` })),
        h('h3', { text: 'Описание от докладващия' }),
        h('p', { class: 'bio', text: r.details || 'Без описание.' }),
        rep ? [h('h3', { text: 'Докладваният профил' }),
          h('p', { class: 'dim', text: `${rep.age} г. · ${rep.city}${rep.regionName && rep.regionName !== rep.city ? ', обл. ' + rep.regionName : ''} · ${rep.photos} снимки · в сайта от ${fmtDate(rep.createdAt)}` }),
          h('p', { class: 'bio', text: rep.bio || 'Няма био.' }),
          rep.otherReports ? h('p', {}, h('span', { class: 'tag st-upheld', text: `⚠️ Още ${rep.otherReports} доклада срещу този профил` })) : null] : null),
      h('div', {},
        h('h3', { text: d.conversation && d.conversation.group ? `Групов чат „${d.conversation.title}“ (снимка към момента на доклада)` : 'Разговор (снимка към момента на доклада)' }),
        h('p', { class: 'hint', text: d.conversation && d.conversation.group ? 'Показани са последните съобщения и файлове в тази група. Останалите чатове не са достъпни.' : 'Показан е само разговорът между тези двама души. Останалите чатове не са достъпни.' }),
        transcript)),
    h('div', { class: 'field', style: 'margin-top:1rem' }, h('label', { for: 'case-note', text: 'Бележка на администратора' }), note),
    h('div', { class: 'actions' },
      r.status !== 'upheld' ? h('button', { class: 'btn', type: 'button', text: '✔ Основателен', onclick: () => decide('upheld') }) : null,
      r.status !== 'dismissed' ? h('button', { class: 'btn ghost', type: 'button', text: '✖ Неоснователен', onclick: () => decide('dismissed') }) : null,
      r.status !== 'open' ? h('button', { class: 'btn ghost', type: 'button', text: '↺ Върни като отворен', onclick: () => decide('open') }) : null,
      r.dossierId ? h('button', { class: 'btn ghost', type: 'button', text: '📁 Досие и наказания', onclick: () => { closeModal(); openDossier(r.dossierId, changed); } }) : null,
      rep && d.reported ? delBtn : null),
    h('p', { class: 'hint', text: 'Отварянето на този доклад е записано в журнала.' })),
  { title: `Доклад #${r.id}` });
}

/* ═══════════ Маршрутизация ═══════════ */
function currentRoute() {
  const r = (location.hash || '#').replace(/^#\/?/, '').split('?')[0];
  return ['discover', 'profile', 'settings', 'admin', 'messages', 'activity'].includes(r) ? r : '';
}
function route() {
  closeModal();
  stopViewTimer();
  document.body.classList.remove('thread-open');
  { const vEl = $('#view'); if (vEl) vEl.className = ''; }
  let r = currentRoute();
  if (!state.me && r !== 'settings') r = '';
  if (r === 'admin' && !(state.me && state.me.role === 'admin')) r = state.me ? 'discover' : '';
  if (r === 'messages' && !(state.me && state.me.role !== 'admin')) r = state.me ? 'discover' : '';
  if (r === 'activity' && !(state.me && state.me.role !== 'admin')) r = state.me ? 'discover' : '';
  // Непотвърден имейл → само екранът за потвърждение (и изход).
  if (state.me && !state.me.emailVerified) { stopBadges(); stopCallWatch(); renderChrome(); if (state.meta) { viewVerify(); document.title = 'Потвърди имейла · Spark'; } return; }
  if (state.me) { startBadges(); startCallWatch(); } else { stopBadges(); stopCallWatch(); }
  if (state.me && r === '') { r = 'discover'; history.replaceState(null, '', '#discover'); }
  renderChrome();
  if (!state.meta) return;
  ({ '': viewLanding, discover: viewDiscover, profile: viewProfile, settings: viewSettings, admin: viewAdmin, messages: viewMessages, activity: viewActivity })[r]();
  window.scrollTo(0, 0);
  const main = $('#view'); if (main) main.focus({ preventScroll: true });
  document.title = ({ '': 'Spark — запознанства', discover: 'Открий хора · Spark', profile: 'Моят профил · Spark', settings: 'Дизайн и настройки · Spark', admin: 'Админ · Spark', messages: 'Съобщения · Spark', activity: 'Активност · Spark' })[r];
  applyTitleBadge();
}

/* ═══════════ Старт ═══════════ */
async function init() {
  loadLocalTheme();
  $('#fontUp').addEventListener('click', () => changeTheme({ fontScale: Math.min(150, theme.fontScale + 10) }));
  $('#fontDown').addEventListener('click', () => changeTheme({ fontScale: Math.max(80, theme.fontScale - 10) }));
  $('#fontReset').addEventListener('click', () => changeTheme({ fontScale: 100 }));
  window.addEventListener('hashchange', route);
  clear($('#view')).append(h('div', { class: 'spinner', role: 'progressbar', 'aria-label': 'Зареждане' }));
  try {
    const [meta, me] = await Promise.all([api('GET', '/api/meta'), api('GET', '/api/me')]);
    state.meta = meta; state.me = me.user;
    adoptServerTheme(me.user);
  } catch (x) {
    clear($('#view')).append(h('div', { class: 'win' }, h('div', { class: 'win-body empty-state' }, h('div', { class: 'big', text: '⚠️' }), h('h2', { text: 'Сървърът не отговаря' }), h('p', { text: x.message }), h('button', { class: 'btn', type: 'button', text: 'Опитай пак', onclick: () => location.reload() }))));
    return;
  }
  route();
}
init();
})();

</script>
