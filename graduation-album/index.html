<style id="app-style">
/* Layout: a hardbound keepsake album. Midnight-navy cover with gold foil, ivory pages with gilt double frames,
   Roman numerals for the grades, photos mounted in mats. Dark theme = the same book by lamplight. */
:root{
  color-scheme:light;
  --bg:#f1eee6; --surface:#fbf9f4; --ink:#14213d; --ink-soft:#586178;
  --gold:#a98332; --gold-lo:#7d5f1f; --line:rgba(169,131,50,.6); --hair:rgba(20,33,61,.14);
  --shadow:rgba(20,33,61,.34); --glow:rgba(169,131,50,.12); --ghost:rgba(169,131,50,.07);
  --cover:#0e1a35; --cover-2:#182a52; --cover-ink:#efe6cf;
  --foil-1:#8f6c22; --foil-2:#e6c96f; --foil-3:#fff3c4;
  --scrim:rgba(6,10,22,.95); --scrim-ink:#f4ecd8;
  --display:'Playfair Display','Bodoni 72',Georgia,serif;
  --body:'EB Garamond',Garamond,Georgia,serif;
  --label:'Jost','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#090f20; --surface:#101a33; --ink:#ece4cf; --ink-soft:#a6aec2;
    --gold:#d6b45e; --gold-lo:#a98332; --line:rgba(214,180,94,.5); --hair:rgba(236,228,207,.17);
    --shadow:rgba(0,0,0,.65); --glow:rgba(214,180,94,.08); --ghost:rgba(214,180,94,.07);
    --cover:#0b1530; --cover-2:#15264a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#090f20; --surface:#101a33; --ink:#ece4cf; --ink-soft:#a6aec2;
  --gold:#d6b45e; --gold-lo:#a98332; --line:rgba(214,180,94,.5); --hair:rgba(236,228,207,.17);
  --shadow:rgba(0,0,0,.65); --glow:rgba(214,180,94,.08); --ghost:rgba(214,180,94,.07);
  --cover:#0b1530; --cover-2:#15264a; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; padding-inline:16px; color:var(--ink);
  background-color:var(--bg);
  background-image:radial-gradient(1100px 520px at 50% -8%,var(--glow),transparent 70%);
  background-repeat:no-repeat;
  font:400 1.12rem/1.65 var(--body);
}
img{max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
button{font:inherit;color:inherit}
#app{max-width:1080px;margin-inline:auto;padding-block:6px 64px}
#app.editing{padding-bottom:150px}
.meta{font:500 .68rem/1.5 var(--label);letter-spacing:.24em;text-transform:uppercase;color:var(--ink-soft);margin:0}

/* top row + rail */
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 14px;padding-block:6px;min-height:52px}
.tools-top{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px}
.lnk{min-height:44px;padding:0 10px;cursor:pointer;background:none;border:0;font:500 .68rem var(--label);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft)}
.lnk:hover{color:var(--ink)}
.rail{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:5;
  display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin;
  margin-inline:-16px;padding:2px 16px;
  background:var(--bg);border-block:1px solid var(--line);
}
.rb{
  flex:none;min-width:46px;min-height:46px;padding:0 12px;cursor:pointer;
  font:500 .78rem var(--label);letter-spacing:.14em;
  background:none;border:0;border-bottom:2px solid transparent;color:var(--ink-soft);
}
.rb:hover{color:var(--ink)}
.rb.on{color:var(--ink);border-bottom-color:var(--gold)}
.rb.first{letter-spacing:.2em;text-transform:uppercase;font-size:.68rem}

/* buttons */
.btn{
  min-height:46px;padding:10px 24px;cursor:pointer;
  font:500 .7rem var(--label);letter-spacing:.22em;text-transform:uppercase;
  background:transparent;border:1px solid var(--gold);color:var(--ink);
}
.btn:hover:not(:disabled){background:var(--ghost);border-color:var(--gold-lo)}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.primary:hover:not(:disabled){opacity:.92;background:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.mini{min-height:40px;min-width:40px;padding:4px 12px;cursor:pointer;font:500 .64rem var(--label);letter-spacing:.14em;text-transform:uppercase;background:transparent;border:1px solid var(--hair);color:var(--ink)}
.mini:hover:not(:disabled){border-color:var(--gold)}
.mini:disabled{opacity:.35;cursor:default}
.mini.warn{border-color:#b3402f;color:#b3402f}

.sheet{margin-top:22px;animation:rise .5s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ornament */
.orn{display:flex;align-items:center;gap:14px;margin:22px 0;color:var(--gold)}
.orn::before,.orn::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line))}
.orn::after{transform:scaleX(-1)}
.orn i{width:7px;height:7px;background:currentColor;transform:rotate(45deg)}

/* cover */
.cover{
  position:relative;text-align:center;color:var(--cover-ink);
  padding:clamp(44px,9vw,92px) clamp(26px,7vw,84px);
  background:radial-gradient(120% 90% at 50% 0%,var(--cover-2),var(--cover));
  box-shadow:0 44px 70px -44px var(--shadow);
}
.cover::before,.cover::after{content:'';position:absolute;pointer-events:none}
.cover::before{inset:12px;border:1px solid var(--foil-2);opacity:.85}
.cover::after{inset:19px;border:1px solid var(--foil-2);opacity:.3}
.cover>*{position:relative}
.seal{display:inline-block;color:var(--foil-2);margin-bottom:6px}
.kick{font:500 .68rem/1.5 var(--label);letter-spacing:.34em;text-transform:uppercase;color:var(--foil-2);margin:14px 0 0}
.foil{
  font:400 clamp(2rem,9vw,4.5rem)/1.08 var(--display);letter-spacing:.01em;margin:14px 0 0;text-wrap:balance;
  background:linear-gradient(105deg,var(--foil-1) 0%,var(--foil-2) 30%,var(--foil-3) 42%,var(--foil-2) 54%,var(--foil-1) 100%);
  background-size:240% 100%;background-position:40% 0;
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  animation:sweep 2.6s ease-out 1;
}
@keyframes sweep{from{background-position:100% 0}to{background-position:40% 0}}
.sub{font:italic 400 1.35rem/1.4 var(--body);color:var(--cover-ink);margin:10px 0 0}
.cover .orn{color:var(--foil-2);max-width:340px;margin:26px auto}
.cover .form{display:grid;gap:14px;max-width:440px;margin:0 auto}
.cover .f{display:grid;justify-items:center;gap:2px}
.cover .f label,.cover .lbl{font:500 .62rem/1.4 var(--label);letter-spacing:.28em;text-transform:uppercase;color:var(--foil-2);padding:0}
.cover .fv{width:100%;border-bottom:1px solid rgba(230,201,111,.45);color:var(--cover-ink);font:italic 400 1.45rem/1.5 var(--body);min-height:2.2rem;overflow-wrap:anywhere}
.cover .f input{width:100%;text-align:center;font:italic 400 1.45rem/1.5 var(--body);color:var(--cover-ink);background:transparent;border:0;border-bottom:1px dashed var(--foil-2);padding:2px;caret-color:var(--foil-2)}
.cover .f input::placeholder{color:rgba(239,230,207,.45)}
.cover :focus-visible{outline-color:var(--foil-2)}

.banner{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-top:18px;padding:12px 16px;border:1px solid var(--line);background:var(--ghost);font:400 1.02rem/1.5 var(--body)}
.hint{margin:22px 0 0;text-align:center;color:var(--ink-soft);font-style:italic}

/* stages + grade cards */
.stage-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px;margin:44px 0 20px}
.stage-h h2{font:italic 400 1.7rem/1.15 var(--display);margin:0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:26px 18px}
.gc{display:flex;flex-direction:column;gap:8px;text-align:left;background:none;border:0;padding:0;cursor:pointer;min-width:0}
.gc-img{position:relative;display:grid;place-items:center;aspect-ratio:4/3;max-width:100%;background:var(--surface);padding:7px;box-shadow:0 0 0 1px var(--hair),0 18px 26px -20px var(--shadow);transition:transform .25s,box-shadow .25s}
.gc:hover .gc-img{transform:translateY(-3px);box-shadow:0 0 0 1px var(--gold),0 22px 30px -20px var(--shadow)}
.gc-img img{width:100%;height:100%;object-fit:cover;display:block}
.gc-n{width:100%;height:100%;display:grid;place-items:center;border:1px solid var(--line);font:italic 400 2.6rem/1 var(--display);color:var(--gold)}
.gc-r{position:absolute;left:7px;top:7px;padding:2px 9px;background:var(--cover);color:var(--foil-2);font:500 .66rem var(--label);letter-spacing:.18em}
.gc-t{font:400 1.2rem/1.2 var(--display)}

/* chapter page */
.page{position:relative;background:var(--surface);padding:clamp(26px,5.5vw,60px);box-shadow:0 0 0 1px var(--hair),0 40px 60px -44px var(--shadow)}
.page::before,.page::after{content:'';position:absolute;pointer-events:none}
.page::before{inset:10px;border:1px solid var(--line)}
.page::after{inset:15px;border:1px solid var(--hair)}
.page>*{position:relative}
.wm{position:absolute;right:clamp(18px,4vw,52px);top:14px;font:italic 400 clamp(5.5rem,22vw,12rem)/1 var(--display);color:var(--gold);opacity:.12;pointer-events:none;user-select:none}
h1{font:400 clamp(2.3rem,8vw,4.1rem)/1.08 var(--display);letter-spacing:.005em;margin:6px 0 0;text-wrap:balance}
h1 em{color:var(--gold)}
.teacher{margin:10px 0 0;font:italic 400 1.35rem/1.4 var(--body)}
.memory{max-width:60ch}
.memory p{margin:0 0 .85em}
.memory>p:nth-of-type(2)::first-letter{font:400 3.2rem/.85 var(--display);float:left;padding:6px 6px 0 0;color:var(--gold)}
.mem{width:100%;min-height:8rem;resize:vertical;font:400 1.08rem/1.6 var(--body);color:var(--ink);background:transparent;border:1px solid var(--line);padding:12px}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;margin:26px 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,235px),1fr));gap:34px 26px;padding-top:12px;align-items:start}
@media (min-width:760px){
  .grid:not(.ed) .ph:first-child:not(:last-child){grid-column:span 2}
  .grid:not(.ed) .ph:first-child:nth-last-child(n+3){grid-row:span 2}
}
.ph{margin:0;min-width:0;padding:12px 12px 14px;background:var(--surface);box-shadow:0 0 0 1px var(--hair),0 22px 30px -24px var(--shadow)}
.ph-b{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in}
.ph img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;outline:1px solid var(--line);outline-offset:-7px}
.grid:not(.ed) .ph:first-child:not(:last-child) img{aspect-ratio:16/10}
.ph figcaption{font:italic 400 1.18rem/1.35 var(--body);text-align:center;padding-top:11px;min-height:2.7em;overflow-wrap:anywhere}
.cap{width:100%;margin-top:10px;text-align:center;font:italic 400 1.15rem/1.35 var(--body);color:var(--ink);background:transparent;border:0;border-bottom:1px dashed var(--gold);padding:3px}
.acts{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:10px}
.ghost{
  display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;text-align:center;
  aspect-ratio:4/3;min-width:0;padding:14px;background:var(--ghost);border:1px dashed var(--line);color:var(--ink-soft);
  font:italic 400 1.2rem/1.3 var(--body);
}
button.ghost{cursor:pointer}
button.ghost:hover{border-color:var(--gold);color:var(--ink)}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:46px;padding-top:20px;border-top:1px solid var(--line)}
.foot{margin:34px 0 0;text-align:center}

/* save bar + toast */
.savebar{
  position:fixed;left:0;right:0;bottom:0;z-index:10;
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));
  background:var(--surface);border-top:1px solid var(--gold);box-shadow:0 -20px 30px -24px var(--shadow);
}
.savebar .st{flex:1 1 220px;min-width:0;font:500 .78rem/1.4 var(--label);letter-spacing:.04em}
.savebar .meta{flex:none}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:12;max-width:min(92vw,520px);padding:12px 20px;background:var(--ink);color:var(--surface);font:500 .78rem/1.4 var(--label);letter-spacing:.06em;text-align:center}

/* lightbox */
.lb{position:fixed;inset:0;z-index:30;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(14px + env(safe-area-inset-bottom,0px));background:var(--scrim);color:var(--scrim-ink)}
.lb-top{display:flex;justify-content:flex-end}
.lb-stage{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;min-height:0}
.lb img{display:block;max-width:100%;max-height:calc(100vh - 190px);margin:auto;object-fit:contain;outline:1px solid #e6c96f;outline-offset:6px}
.lb-n,.lb-x{min-width:46px;min-height:46px;padding:0 14px;cursor:pointer;background:transparent;border:1px solid #e6c96f;color:var(--scrim-ink);font:500 .7rem var(--label);letter-spacing:.2em;text-transform:uppercase}
.lb-cap{margin:0;text-align:center;font:italic 400 1.3rem/1.35 var(--body)}

.print-book{display:none}
@media (max-width:520px){
  .lb-stage{grid-template-columns:minmax(0,1fr)}
  .lb-n{display:none}
  .page{padding-inline:24px}
}
@media (prefers-reduced-motion:reduce){
  .sheet,.foil{animation:none}
  *{transition:none!important}
}
@media print{
  :root{--bg:#fff;--surface:#fff;--ink:#14213d;--ink-soft:#4a5368;--gold:#a98332;--line:rgba(169,131,50,.7);--hair:rgba(20,33,61,.22);--shadow:rgba(0,0,0,.18);--glow:transparent;--ghost:transparent;color-scheme:light}
  @page{size:A4;margin:12mm}
  body{background:#fff!important;padding-inline:0;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-size:11pt}
  #view,.savebar,.toast,.lb{display:none!important}
  .print-book{display:block}
  .print-book>.sheet{margin:0;animation:none;break-after:page}
  .print-book>.sheet:last-child{break-after:auto}
  .banner,.hint{display:none}
  .foil{animation:none}
  .ph{break-inside:avoid}
  .page{box-shadow:none}
}
</style>

var SEAL=(function(){
  var t='';
  for(var i=0;i<48;i++){
    var a=i*7.5*Math.PI/180,r2=i%4===0?43:45;
    t+='<line x1="'+(60+47*Math.cos(a)).toFixed(1)+'" y1="'+(60+47*Math.sin(a)).toFixed(1)+'" x2="'+(60+r2*Math.cos(a)).toFixed(1)+'" y2="'+(60+r2*Math.sin(a)).toFixed(1)+'"/>';
  }
  return '<svg viewBox="0 0 120 120" width="92" height="92" fill="none" stroke="currentColor" stroke-width=".8"><circle cx="60" cy="60" r="57"/><circle cx="60" cy="60" r="52" stroke-width=".5"/>'+t+'<text x="60" y="68" text-anchor="middle" font-family="Playfair Display,Georgia,serif" font-style="italic" font-size="25" fill="currentColor" stroke="none">I–XII</text></svg>';
})();

/* ---- demo pictures: tiny generated SVG scenes, clearly marked ---- */
var PALS=[['#1d2b53','#8793b5'],['#4a2c3b','#d3a98f'],['#26453f','#a9c4aa'],['#38364f','#cdb67e'],['#5a3a2a','#e6cfa4'],['#22344c','#a5bbcf']];
function sampleImg(i){
  var p=PALS[i%PALS.length],s=(i+3)*977,svg='';
  function rnd(){s=(s*9301+49297)%233280;return s/233280}
  svg+='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+p[0]+'"/><stop offset="1" stop-color="'+p[1]+'"/></linearGradient></defs><rect width="800" height="600" fill="url(#g)"/>';
  for(var k=0;k<6;k++)svg+='<circle cx="'+Math.round(rnd()*800)+'" cy="'+Math.round(rnd()*360)+'" r="'+Math.round(40+rnd()*90)+'" fill="#fff" opacity="'+(0.05+rnd()*0.1).toFixed(2)+'"/>';
  svg+='<rect y="430" width="800" height="170" fill="#0b1226" opacity=".38"/>';
  var n=4+Math.floor(rnd()*3),x=110;
  for(var q=0;q<n;q++){
    var h=70+Math.round(rnd()*40);
    svg+='<g fill="#0b1226" opacity=".62"><circle cx="'+x+'" cy="'+(400-h)+'" r="27"/><rect x="'+(x-38)+'" y="'+(432-h)+'" width="76" height="'+(h+170)+'" rx="30"/></g>';
    x+=Math.round(560/n)+Math.round(rnd()*14);
  }
  svg+='<text x="780" y="580" text-anchor="end" font-family="Georgia,serif" font-size="22" letter-spacing="6" fill="#fff" opacity=".6">ДЕМО</text></svg>';
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg);
}
function seedDemo(){
  var d={v:1,demo:true,school:'12 „А“ клас · демо',year:'2010',ch:{}},n=0;
  for(var g=1;g<=12;g++){
    var ps=[];
    for(var k=0;k<3;k++)ps.push({src:sampleImg(n++),cap:IDEAS[g][k]});
    d.ch[g]={teacher:'',memory:DEMO_MEMORY[g]||'',photos:ps};
  }
  return d;
}

/* ---- adding photos ---- */
function pick(g){pickG=g;fin.click()}

function shrink(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      try{
        var s=Math.min(1,1000/Math.max(img.naturalWidth,img.naturalHeight));
        var c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(img.naturalWidth*s));c.height=Math.max(1,Math.round(img.naturalHeight*s));
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',0.78));
      }catch(e){rej(e)}finally{URL.revokeObjectURL(url)}
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('decode'))};
    img.src=url;
  });
}

async function addFiles(g,files){
  var c=chOf(g),ok=0,bad=0,full=false;
  for(var k=0;k<files.length;k++){
    setStatus('Обработвам снимка '+(k+1)+' от '+files.length+'…');
    try{
      var src=await shrink(files[k]);
      if(bytes()+src.length>LIMIT){full=true;break}
      c.photos.push({src:src,cap:''});ok++;
    }catch(e){bad++}
  }
  if(ok){if(LOCAL)persist();else dirty=true}
  render();
  var msg=ok?(ok+' '+(ok===1?'добавена':'добавени')+(LOCAL?'.':'. Не забравяй да запазиш.')):'';
  if(bad)msg+=(msg?' ':'')+bad+' не можаха да се прочетат (снимки HEIC от телефон запази като JPEG).';
  if(full)msg+=(msg?' ':'')+'Достигнат е лимитът на албума, останалите не са добавени.';
  setStatus(msg||'Нищо не е добавено.');
}

/* ---- status, saving ---- */

/* local mode: IndexedDB */
function idb(){
  return new Promise(function(res,rej){
    if(!window.indexedDB){rej(new Error('no idb'));return}
    var r=indexedDB.open('graduation-album',1);
    r.onupgradeneeded=function(){r.result.createObjectStore('kv')};
    r.onsuccess=function(){res(r.result)};
    r.onerror=function(){rej(r.error)};
  });
}
function idbGet(k){
  return idb().then(function(db){return new Promise(function(res,rej){
    var q=db.transaction('kv').objectStore('kv').get(k);
    q.onsuccess=function(){res(q.result)};q.onerror=function(){rej(q.error)};
  })});
}
function idbSet(k,v){
  return idb().then(function(db){return new Promise(function(res,rej){
    var t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);
    t.oncomplete=function(){res()};t.onerror=function(){rej(t.error)};t.onabort=function(){rej(t.error)};
  })});
}
var persistT=0;
function persist(){
  clearTimeout(persistT);
  persistT=setTimeout(function(){
    idbSet('album',state).then(function(){setStatus('Запазено в този браузър.')})
      .catch(function(){setStatus('Не може да се запази в браузъра. Направи експорт, за да не загубиш албума.')});
  },500);
}
function clearDemo(){state=normalize({v:1,ch:{}});persist();render();setStatus('Празен албум. Избери клас и добави снимки.')}
function toggleTheme(){
  var r=document.documentElement;
  var cur=r.getAttribute('data-theme')||((window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light');
  var nx=cur==='dark'?'light':'dark';
  r.setAttribute('data-theme',nx);
  try{localStorage.setItem('album-theme',nx)}catch(e){}
}
function exportJson(){

  var u=URL.createObjectURL(b);
  var a=el('a',{href:u,download:'abiturientski-album.json'});
  document.body.append(a);a.click();a.remove();

/* print / save as PDF (local mode only: the artifact viewer cannot open the print dialog) */
function preparePrint(){

  var kids=[cover()];
  for(var g=1;g<=12;g++)kids.push(chapter(g));
  printBook.replaceChildren.apply(printBook,kids);
  forPrint=false;editing=was;
}

window.addEventListener('beforeprint',function(){if(LOCAL)preparePrint()});

/* artifact mode: the page republishes itself */
function buildDoc(){
  var rs=document.head&&document.head.querySelector('style');
  var reset=(rs&&rs.textContent)||RESET_FALLBACK;
  var css=document.getElementById('app-style').textContent;
  var js=document.getElementById('app-js').textContent;
  var json=JSON.stringify(state).replace(/</g,'\\u003c');
  var S='<'+'script';
  var E='<'+'/script>';
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'
    +'<title>'+TITLE+'</title>\n'+LINK+'\n<style id="app-style">'+css+'</style>\n<div id="app"></div>\n'
    +S+' type="application/json" id="album-data">'+json+E+'\n'
    +S+' id="app-js">'+js+E+'</body></html>';
}

async function save(){
  if(saving)return;
  saving=true;updateBar();setStatus('Запазвам…');
  try{
    var a=await claude.use('artifact');
    if(!a)throw {code:'not_granted'};
    try{sessionStorage.setItem('album-route','k'+route)}catch(e){}
    await a.publish(buildDoc());
    dirty=false;setStatus('Запазено.');
  }catch(e){
    var code=e&&e.code;
    if(code==='conflict')setStatus('Някой друг е запазил по-нова версия. Страницата се обновява.');
    else if(code==='too_large')setStatus('Албумът е твърде голям за запазване. Премахни няколко снимки.');
    else if(code==='rate_limited')setStatus('Запазваш твърде често. Изчакай малко.');
    else if(code==='not_writer'||code==='not_granted'||code==='not_declared'||code==='capability_disabled'||code==='consent_required'){
      canEdit=false;editing=false;setStatus('Този изглед е само за четене, не можеш да запазваш.');render();
    }else setStatus('Не се запази. Опитай пак след малко.');
  }
  saving=false;updateBar();
}

/* ---- start ---- */
if(LOCAL){
  idbGet('album').then(function(d){state=normalize(d||seedDemo())})
    .catch(function(){state=normalize(seedDemo())})
    .then(function(){render()});
}else{
  Promise.all([claude.use('user'),claude.use('artifact')]).then(function(r){
    if(!r[0]||!r[1])return;
    return Promise.resolve(r[0].canEdit()).then(function(ok){if(ok){canEdit=true;render()}});
  }).catch(function(){});
  render();
}
})();
</script>
