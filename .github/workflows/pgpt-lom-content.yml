name: PGPT-Lom – rebuild content

# Runs when someone changes the data files in pgpt-lom/content/ (for example through Pages CMS):
# regenerates the news/documents blocks in index.html, the per-page SEO pages and sitemap.xml, and commits the result.
on:
  push:
    branches: [main]
    paths:
      - "pgpt-lom/content/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pgpt-lom-content
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python pgpt-lom/tools/build_content.py
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pgpt-lom
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "pgpt-lom: rebuild generated content"
            git push
          fi
